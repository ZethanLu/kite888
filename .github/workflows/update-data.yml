name: update-data

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 台北時間 15:10(UTC 07:10),週一到週五
    - cron: "45 7 * * 1-5"   # 備援:只有在當天還沒更新時才會抓
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: python scripts/fetch_data.py ${{ github.event.schedule == '45 7 * * 1-5' && '--if-stale' || '' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || (git commit -m "data: $(TZ=Asia/Taipei date '+%F %R')" && git push)
