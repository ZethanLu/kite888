<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STOCK WEB 持股與策略終端機</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  box-sizing: border-box;
  color-scheme: light;
  --bg: #f1f4f9;
  --bg-sub: #e8ecf3;
  --card: #ffffff;
  --card-hover: #f8fafd;
  --tx: #141c28;
  --mu: #64748b;
  --ac: #0d9488;
  --ac-hover: #0f766e;
  --acbg: #ccfbf1;
  --r: #e11d48;
  --g: #10b981;
  --st: #f59e0b;
  --tpc: #8b5cf6;
  --bd: #e2e8f0;
  --warnbg: #fef3c7;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 30px -5px rgba(15, 23, 42, 0.15);
  --font-num: "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0f17;
    --bg-sub: #161e2e;
    --card: #111827;
    --card-hover: #1b2538;
    --tx: #f1f5f9;
    --mu: #94a3b8;
    --ac: #2dd4bf;
    --ac-hover: #14b8a6;
    --acbg: rgba(45, 212, 191, 0.14);
    --r: #fb7185;
    --g: #34d399;
    --st: #fbbf24;
    --tpc: #a78bfa;
    --bd: #1e293b;
    --warnbg: rgba(245, 158, 11, 0.15);
    --shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f17;
  --bg-sub: #161e2e;
  --card: #111827;
  --card-hover: #1b2538;
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --ac: #2dd4bf;
  --ac-hover: #14b8a6;
  --acbg: rgba(45, 212, 191, 0.14);
  --r: #fb7185;
  --g: #34d399;
  --st: #fbbf24;
  --tpc: #a78bfa;
  --bd: #1e293b;
  --warnbg: rgba(245, 158, 11, 0.15);
  --shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-width: 1120px;
  overflow-x: auto;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* 整體框架 */
#shell { display: flex; min-height: 100vh; }
#side {
  width: 230px;
  flex: none;
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--card);
  border-right: 1px solid var(--bd);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--tx);
  font-weight: 800;
  letter-spacing: 0.08em;
  font-size: 16px;
  padding: 4px 12px 22px;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--ac);
  box-shadow: 0 0 10px var(--ac);
}
#side nav { display: flex; flex-direction: column; gap: 6px; }
#side nav button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
  border: 0;
  background: none;
  padding: 11px 14px;
  border-radius: 10px;
  color: var(--mu);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}
#side nav button:hover { background: var(--bg); color: var(--tx); }
#side nav button.on { background: var(--acbg); color: var(--ac); font-weight: 700; }
.nav-badge {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--bg-sub);
  color: var(--mu);
  font-family: var(--font-num);
}
#side nav button.on .nav-badge { background: var(--ac); color: #fff; }
.side-wind {
  margin-top: 20px;
  padding: 12px;
  background: var(--bg);
  border-radius: 10px;
  border: 1px solid var(--bd);
  font-size: 12.5px;
}
.sidefoot {
  margin-top: auto;
  padding: 12px 10px 4px;
  border-top: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 頂部導覽列 */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#top {
  position: sticky;
  top: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 32px;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--bd);
  min-height: 62px;
}
#ttl { font-size: 18px; font-weight: 700; white-space: nowrap; }
.search { position: relative; width: min(480px, 36vw); margin-left: 8px; }
.search input {
  padding-left: 14px;
  padding-right: 64px;
  background: var(--bg);
  border-radius: 10px;
  height: 38px;
}
.search-kbd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: var(--mu);
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 5px;
  padding: 1px 6px;
  pointer-events: none;
}
.rs {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  max-height: 400px;
  overflow: auto;
  z-index: 40;
}
.rs:empty { display: none; }
.rs div {
  padding: 10px 16px;
  border-top: 1px solid var(--bd);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rs div:first-child { border-top: 0; }
.rs div:hover { background: var(--bg); }
.sp { flex: 1; }

/* 主內容區與網格系統 */
#app { padding: 24px 32px 64px; max-width: 1840px; width: 100%; margin: 0 auto; }
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 16px;
  border: 1px solid var(--bd);
  box-shadow: var(--shadow);
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.card.item:hover { border-color: var(--ac); background: var(--card-hover); }
.mu { color: var(--mu); font-size: 12.5px; }
.big { font-size: 26px; font-weight: 800; line-height: 1.2; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 18px;
}
.kpi-strip > .card { margin: 0; padding: 16px 20px; }
.idx-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.idx-strip > .card { margin: 0; padding: 14px 16px; }
.dash-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(380px, 1fr);
  gap: 20px;
  align-items: start;
}
.cols2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}
.dgrid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 440px;
  gap: 20px;
  align-items: start;
}
.dl, .dr { min-width: 0; }
.dr-sticky { position: sticky; top: 82px; }
.sec {
  margin: 0 2px 10px;
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* 標籤、按鈕與提示 */
.note {
  background: var(--acbg);
  color: var(--ac);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13.5px;
  margin-bottom: 16px;
  font-weight: 500;
}
.note.w { background: var(--warnbg); color: var(--st); }
.alert {
  background: var(--warnbg);
  border: 1px solid color-mix(in srgb, var(--st) 35%, transparent);
  border-radius: 10px;
  padding: 12px 16px;
  margin-top: 10px;
}
.alert b { color: var(--st); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chip {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  padding: 2px 8px;
  background: var(--acbg);
  color: var(--ac);
  white-space: nowrap;
}
.chip.bad { background: var(--warnbg); color: var(--st); }
.chip.r { background: color-mix(in srgb, var(--r) 15%, transparent); color: var(--r); }
.chip.g { background: color-mix(in srgb, var(--g) 15%, transparent); color: var(--g); }
.chip.mu-chip { background: var(--bg-sub); color: var(--mu); }

.seg { display: inline-flex; gap: 4px; background: var(--bg-sub); padding: 4px; border-radius: 10px; margin-bottom: 14px; }
button, input, select, textarea { font: inherit; color: var(--tx); }
.seg button {
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 5px 14px;
  cursor: pointer;
  color: var(--mu);
  font-weight: 500;
  font-size: 13px;
  transition: all 0.12s;
}
.seg button:hover { color: var(--tx); }
.seg button.on { background: var(--card); color: var(--ac); font-weight: 700; box-shadow: var(--shadow); }
.back, .btn {
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
  font-weight: 500;
  font-size: 13.5px;
  transition: all 0.15s;
  white-space: nowrap;
}
.back:hover, .btn:hover { border-color: var(--ac); color: var(--ac); }
.btn.p { background: var(--ac); color: #fff; border-color: var(--ac); }
.btn.p:hover { background: var(--ac-hover); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 6px; }
.btn:disabled { opacity: 0.6; cursor: wait; }

input, select, textarea {
  width: 100%;
  border: 1px solid var(--bd);
  background: var(--bg);
  border-radius: 8px;
  padding: 8px 11px;
  font-size: 13.5px;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid color-mix(in srgb, var(--ac) 35%, transparent);
  border-color: var(--ac);
  background: var(--card);
}
input[type=checkbox] { width: auto; margin-right: 6px; accent-color: var(--ac); }
.item { cursor: pointer; }

/* 數值小格子與進度條 */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 10px; margin-top: 12px; }
.kv div { background: var(--bg); border-radius: 9px; padding: 9px 12px; border: 1px solid var(--bd); }
.kv b { display: block; font-size: 15.5px; margin-top: 2px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.bar {
  position: relative;
  height: 8px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--st), var(--bd) 35%, var(--bd) 65%, var(--tpc));
  margin: 20px 0 6px;
}
.bar i { position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 2px; background: var(--tx); }

/* 資產配置視覺條 */
.alloc-bar {
  display: flex;
  height: 12px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--bg-sub);
  gap: 2px;
  margin: 10px 0 8px;
}
.alloc-seg { height: 100%; transition: opacity 0.15s; cursor: pointer; }
.alloc-seg:hover { opacity: 0.8; }
.alloc-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--mu); }
.alloc-legend span { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.alloc-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* 表格優化 */
ul { margin: 6px 0 0; padding-left: 18px; }
li { margin: 5px 0; }
a { color: var(--ac); text-decoration: none; }
a:hover { text-decoration: underline; }
svg { width: 100%; height: auto; display: block; }
.gl { stroke: var(--bd); stroke-width: 0.6; }

.ed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.ed.cols-2 { grid-template-columns: 1fr 1fr; }
.ed label { display: block; font-size: 12px; color: var(--mu); margin-bottom: 4px; font-weight: 500; }
.ed .f { grid-column: 1 / -1; }
.ed .ck {
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 10px 14px;
}
.ed .ck-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px; }
.ed .ck label { display: flex; align-items: center; font-size: 13px; color: var(--tx); margin: 2px 0; cursor: pointer; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 10px 10px; text-align: right; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mu); font-weight: 600; font-size: 12px; white-space: nowrap; letter-spacing: 0.02em; }
tr + tr td { border-top: 1px solid var(--bd); }
.tbl th, .tbl td { padding: 11px 12px; }
.tbl th.l, .tbl td.l { text-align: left; }
.tbl th {
  position: sticky;
  top: 62px;
  background: var(--card);
  z-index: 5;
  border-bottom: 2px solid var(--bd);
}
.tbl tr.item:hover td { background: var(--card-hover); }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--tx); }
.tcard { padding: 4px 12px 8px; overflow-x: auto; }

/* 迷你停損停利區間尺 */
.mini-rng {
  width: 76px;
  height: 5px;
  background: var(--bg-sub);
  border-radius: 99px;
  position: relative;
  display: inline-block;
  vertical-align: middle;
  margin-right: 6px;
}
.mini-rng i {
  position: absolute;
  top: -2px;
  width: 3px;
  height: 9px;
  border-radius: 2px;
  background: var(--tx);
}

/* 側邊滑出抽屜 (Drawer) */
#drawer-mask {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(2px);
  z-index: 90;
  display: none;
  justify-content: flex-end;
}
#drawer-mask.open { display: flex; }
#drawer {
  width: min(680px, 92vw);
  height: 100vh;
  background: var(--card);
  border-left: 1px solid var(--bd);
  box-shadow: var(--shadow-lg);
  padding: 24px 28px;
  overflow-y: auto;
}

.ax { font-size: 11px; fill: var(--mu); font-family: var(--font-num); }
.hl { font-size: 11px; fill: var(--tx); font-family: var(--font-num); font-weight: 600; }
.xh { stroke: var(--tx); stroke-width: 0.8; stroke-dasharray: 3 2; opacity: 0.7; }
.cinfo {
  min-height: 48px;
  margin: 6px 0 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--bd);
}
</style>
</head>
<body>
<div id="shell">
  <aside id="side">
    <div class="brand"><span class="brand-dot"></span>STOCK WEB</div>
    <nav>
      <button data-t="home" class="on"><span>總覽儀表板</span><span class="nav-badge" id="nb-exit" hidden>0</span></button>
      <button data-t="hold"><span>持股部位管理</span><span class="nav-badge" id="nb-hold">0</span></button>
      <button data-t="watch"><span>策略觀察清單</span><span class="nav-badge" id="nb-watch">0</span></button>
      <button data-t="set"><span>系統與連線設定</span></button>
    </nav>
    <div id="side-wind-box"></div>
    <div class="sidefoot">
      <button class="btn sm" id="theme-btn" style="width:100%">切換深色 / 淺色模式</button>
      <div class="mu" id="verinfo" style="text-align:center;font-size:11.5px"></div>
    </div>
  </aside>

  <div id="main">
    <header id="top">
      <button class="back" id="hb" hidden>← 返回</button>
      <b id="ttl">總覽儀表板</b>
      <div class="search">
        <input id="q" placeholder="快速搜尋代號或名稱 (例如 2330、台達電、NVDA)..." autocomplete="off">
        <span class="search-kbd">/</span>
        <div class="rs" id="rs"></div>
      </div>
      <span class="sp"></span>
      <span class="mu" id="updinfo"></span>
      <button class="btn" id="qadd-btn">＋ 快速新增</button>
      <button class="btn p" id="upd">更新資料</button>
    </header>
    <main id="app"></main>
  </div>
</div>

<!-- 電腦版側邊快速編輯抽屜 -->
<div id="drawer-mask">
  <div id="drawer"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = (n, d = 2) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ema = (a, n) => { const k = 2 / (n + 1); let e = a[0]; return a.map(v => e = v * k + e * (1 - k)); };
const ma = (a, n) => a.map((_, i) => i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((x, y) => x + y, 0) / n);
const mkt = s => /\.TWO?$|^\^TW/.test(s) ? "TW" : "US";
const cur = m => m === "TW" ? "NT$" : "US$";
const cc = v => v >= 0 ? "var(--r)" : "var(--g)";
const sgn = (v, d = 2) => (v >= 0 ? "+" : "−") + fmt(Math.abs(v), d);
const UP = "var(--r)", DN = "var(--g)";
const N = { d: 135, w: 104, m: 60 }, TFN = { d: "日 K", w: "週 K", m: "月 K" }, TFU = { d: "日", w: "週", m: "個月" };
let TF = "d", RV = null, DTAB = "strat", QFILTER = "";
const VER = "v16・桌面寬螢幕旗艦版";
let UPD = "", WF = "all";
const TAGS = ["打工型", "上班型", "老闆型", "市值排列", "其他"];

const RS = {
  "stop": [
    ["m_osc_down", "月 MACD 柱體比上月差"],
    ["w_osc_down", "週 MACD 柱體比上週差(週五判斷)"],
    ["w_close_down", "週收盤比上週差(週五判斷)"],
    ["below_w5", "收盤跌破 5 週均線"],
    ["below_ma20", "收盤跌破 20 日線"],
    ["below_ma60", "收盤跌破 60 日線(季線)"],
    ["below_ma120", "收盤跌破 120 日線(半年線)"],
    ["below_prev_wlow", "收盤跌破上週最低點"],
    ["below_entry_low", "收盤跌破進場日低點"],
    ["loss5", "虧損達 -5%"]
  ],
  "tp": [
    ["w_close_down", "週收盤比上週差(週五判斷)"],
    ["w_high_fail", "當週最高價未創前週新高(週五判斷)"],
    ["w_osc_down", "週 MACD 柱體比上週差(週五判斷)"],
    ["m_osc_down", "月 MACD 柱體比上月差"],
    ["below_ma5", "收盤跌破 5 日線"],
    ["below_w5", "收盤跌破 5 週均線"],
    ["fall_back", "獲利跌回門檻(保本)"]
  ]
};

const RG = { STRONG_WIND: "強風", CHOPPY: "亂流", GUST: "陣風", NO_WIND: "無風" };
const RGT = { STRONG_WIND: "勝率偏高的順風行情", CHOPPY: "行情震盪，嚴守紀律", GUST: "開始起風，嘗試交易", NO_WIND: "勝率極低，多做多賠！" };
const GOV = { TW: "^TWOII", US: "^SOX" };
const rgChip = r => `<span class="chip ${r === "STRONG_WIND" || r === "GUST" ? "r" : "g"}">${RG[r] || r}</span>`;
const RGN = {
  STRONG_WIND: "老闆型、上班族型全策略可用",
  CHOPPY: "老闆型分 5 筆以上，上班族型降級或觀望",
  GUST: "開始起風，可用小部位嘗試",
  NO_WIND: "僅限老闆型「廉價收購」，上班族型暫停"

/* GitHub API 讀寫 */
function gh() {
  let o = "", r = "";
  if (typeof location !== "undefined" && location.hostname.endsWith(".github.io")) {
    o = location.hostname.split(".")[0];
    r = location.pathname.split("/")[1] || "";
  }
  return { o: LS.get("gh_o") || o, r: LS.get("gh_r") || r, b: LS.get("gh_b") || "main", t: LS.get("gh_t") || "" };
}
const b64e = s => { let b = ""; new TextEncoder().encode(s).forEach(c => b += String.fromCharCode(c)); return btoa(b); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));

async function api(path, opt = {}) {
  const g = gh();
  if (!g.t || !g.o || !g.r) throw new Error("請先到左側「系統與連線設定」設定 GitHub 連線(帳號、repo 與存取權杖)");
  const isGet = !opt.method;
  const res = await fetch(`https://api.github.com/repos/${g.o}/${g.r}/${path}${isGet ? (path.includes("?") ? "&" : "?") + "_=" + Date.now() : ""}`, {
    ...opt,
    cache: "no-store",
    headers: {
      Authorization: `Bearer ${g.t}`,
      Accept: opt.accept || "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Content-Type": "application/json"
    }
  });
  if (!res.ok) {
    let d = "";
    try { d = (await res.json()).message || ""; } catch (x) {}
    const e = new Error((res.status === 401 ? "權杖無效或已過期" : res.status === 403 || res.status === 404 ? "沒有權限或找不到 repo，請檢查權杖權限與 repo 名稱" : res.status === 409 ? "檔案剛被更新過，請重新整理頁面後再試一次" : `GitHub 回應 ${res.status}`) + (d ? `(${d})` : ""));
    e.status = res.status;
    throw e;
  }
  return res.status === 204 ? null : res.json();
}

async function readCfg() {
  const j = await api(`contents/holdings.json?ref=${encodeURIComponent(gh().b)}`);
  const cfg = JSON.parse(b64d(j.content));
  cfg.holdings = cfg.holdings || [];
  cfg.watchlist = cfg.watchlist || [];
  return { cfg, sha: j.sha };
}

async function mutate(fn, msg) {
  for (let k = 0; k < 3; k++) {
    const { cfg, sha } = await readCfg();
    fn(cfg);
    try {
      await api("contents/holdings.json", {
        method: "PUT",
        body: JSON.stringify({ message: msg, content: b64e(JSON.stringify(cfg, null, 2) + "\n"), sha, branch: gh().b })
      });
      return cfg;
    } catch (e) {
      if ((e.status !== 409 && e.status !== 422) || k >= 2) throw e;
      await new Promise(r => setTimeout(r, 900));
    }
  }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function refreshData() {
  if (UPD) return;
  const set = t => { UPD = t; const b = $("#upd"); if (b) { b.textContent = t || "更新資料"; b.disabled = !!t; } };
  const runs = () => api("actions/workflows/update-data.yml/runs?per_page=1").then(j => (j.workflow_runs || [])[0]);
  try {
    set("送出中…");
    const prev = await runs();
    await api("actions/workflows/update-data.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: gh().b }) });
    set("更新中(約 1–3 分鐘)…");
    let run = null;
    for (let i = 0; i < 45; i++) {
      await sleep(8000);
      const r = await runs();
      if (r && (!prev || r.id !== prev.id)) { run = r; if (r.status === "completed") break; }
    }
    if (!run || run.status !== "completed") { set(""); say("更新還在進行中，請稍後重新整理頁面。", 1); return render(); }
    if (run.conclusion !== "success") { set(""); say("更新失敗(" + run.conclusion + ")，請到 GitHub 的 Actions 頁面查看 log。", 1); return render(); }
    const j = await api(`contents/data/data.json?ref=${encodeURIComponent(gh().b)}`, { accept: "application/vnd.github.raw+json" });
    DB = j; DB.holdings = DB.holdings || []; DB.watchlist = DB.watchlist || [];
    set(""); say("資料已更新完成！"); render();
  } catch (e) {
    set("");
    say("更新失敗：" + e.message + (e.status === 403 || e.status === 404 ? " (請確認 token 的 Actions 權限為 Read and write)" : ""), 1);
    render();
  }
}

/* 行情與基礎資料計算 */
function quote(sym) {
  const o = (DB.indices[sym] || DB.stocks[sym]);
  if (!o || !o.bars || o.bars.length < 2) return null;
  const d = o.bars.map(([t, o, h, l, c, v]) => ({ t, o, h, l, c, v }));
  const cv = a => a.map(([t, o, h, l, c, v]) => ({ t, o, h, l, c, v }));
  return { d, w: o.wk ? cv(o.wk) : agg(d, "w"), m: o.mo ? cv(o.mo) : agg(d, "m"), px: d.at(-1).c, prev: d.at(-2).c, news: o.news || [] };
}
function agg(d, k) {
  const g = []; let key = null;
  for (const x of d) {
    const kk = k === "w" ? Math.floor((x.t / 86400 + 3) / 7) : new Date(x.t * 1000).toISOString().slice(0, 7);
    if (kk !== key) { g.push({ ...x }); key = kk; }
    else { const y = g[g.length - 1]; y.h = Math.max(y.h, x.h); y.l = Math.min(y.l, x.l); y.c = x.c; y.v += x.v; }
  }
  return g;
}
const held = s => DB.holdings.find(h => h.sym === s);
const TMP = {};
const nameOf = s => (held(s) || DB.watchlist.find(w => w.sym === s) || {}).name || TMP[s] || (DB.indices[s] || {}).name || s;
const stat = (h, p) => {
  const e = ex(h);
  return e && e.state === "EXIT" ? ["bad", "觸發出場"] : p <= h.stop ? ["bad", "跌破停損"] : p >= h.tp * 0.97 ? ["bad", "接近停利"] : ["", "持有中"];
};

/* SVG 專業技術線圖 (含 MA5 / MA20 / MA60) */
let CW = 960, PR = 60, PW = CW - PR;
const setCW = w => { CW = Math.max(580, Math.floor(w)); PW = CW - PR; };
const KH = 420, VH = 95, MH = 135;
const pf = v => v >= 1000 ? fmt(v, 0) : v >= 100 ? fmt(v, 1) : fmt(v, 2);
const fmtVol = v => v >= 1e8 ? fmt(v / 1e8, 2) + "億" : v >= 1e4 ? fmt(v / 1e4, 0) + "萬" : fmt(v, 0);
const chartW = () => {
  const aw = ($("#app") && $("#app").clientWidth) || 1280;
  return Math.min(1320, aw >= 1120 ? aw - 440 - 20 - 64 : aw - 64);
};
const XH = H => `<line class="xh" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden"/>`;

function kline(S, d, ln) {
  const Hh = KH, bw = PW / d.length;
  const fullC = S.map(k => k.c);
  const m5 = ma(fullC, 5).slice(-d.length);
  const m20 = ma(fullC, 20).slice(-d.length);
  const m60 = ma(fullC, 60).slice(-d.length);

  ln = ln.filter(l => Number.isFinite(l.y) && l.y > 0);
  const cl = Math.min(...d.map(k => k.l)), chh = Math.max(...d.map(k => k.h)), sp = chh - cl || chh * 0.02;
  const inR = l => l.y >= cl - sp * 0.6 && l.y <= chh + sp * 0.6;
  const all = d.flatMap(k => [k.h, k.l]).concat(ln.filter(inR).map(l => l.y));
  const lo = Math.min(...all) * 0.995, hi = Math.max(...all) * 1.005;
  const y = v => 12 + (hi - v) / (hi - lo) * (Hh - 24);

  let s = `<svg class="cs" viewBox="0 0 ${CW} ${Hh}">`;
  for (let i = 0; i < 8; i++) {
    const v = hi - (hi - lo) * i / 7, yy = y(v);
    s += `<line class="gl" x1="0" x2="${PW}" y1="${yy}" y2="${yy}"/><text class="ax" x="${CW - 3}" y="${yy + 4}" text-anchor="end">${pf(v)}</text>`;
  }
  d.forEach((k, i) => {
    const x = i * bw + bw / 2, c = k.c >= k.o ? UP : DN;
    s += `<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${c}"/><rect x="${x - bw * 0.34}" y="${y(Math.max(k.o, k.c))}" width="${bw * 0.68}" height="${Math.max(1.2, Math.abs(y(k.o) - y(k.c)))}" fill="${c}"/>`;
  });
  const pline = (arr, col, w = 1.4) => `<polyline fill="none" stroke="${col}" stroke-width="${w}" points="${arr.map((v, i) => v == null ? "" : `${i * bw + bw / 2},${y(v)}`).filter(Boolean).join(" ")}"/>`;
  s += pline(m60, "#3b82f6", 1.3) + pline(m20, "#f59e0b", 1.5) + pline(m5, "#a855f7", 1.3);

  let ly0 = -99;
  [...ln].sort((a, b) => b.y - a.y).forEach(l => {
    const o = !inR(l), yy = o ? (l.y > chh ? 12 : Hh - 12) : y(l.y);
    let ty = Math.max(yy - 4, ly0 + 14); ly0 = ty;
    s += `<line x1="0" x2="${PW}" y1="${yy}" y2="${yy}" stroke="${l.c}" stroke-dasharray="5 4"/><text x="${PW - 4}" y="${ty}" text-anchor="end" font-size="11" font-weight="600" fill="${l.c}">${l.t} ${pf(l.y)}${o ? (l.y > chh ? " ↑" : " ↓") : ""}</text>`;
  });
  let hI = 0, lI = 0;
  d.forEach((k, i) => { if (k.h > d[hI].h) hI = i; if (k.l < d[lI].l) lI = i; });
  const an = x => x > PW - 45 ? "end" : x < 45 ? "start" : "middle";
  s += `<text class="hl" x="${(hI + 0.5) * bw}" y="${y(d[hI].h) - 5}" text-anchor="${an((hI + 0.5) * bw)}">高 ${pf(d[hI].h)}</text>`;
  s += `<text class="hl" x="${(lI + 0.5) * bw}" y="${y(d[lI].l) + 14}" text-anchor="${an((lI + 0.5) * bw)}">低 ${pf(d[lI].l)}</text>`;
  const lk = d[d.length - 1], lc = d.length > 1 && lk.c < d[d.length - 2].c ? DN : UP, ly = y(lk.c);
  s += `<rect x="${PW + 2}" y="${ly - 9}" width="${PR - 4}" height="18" rx="4" fill="${lc}"/><text x="${CW - 5}" y="${ly + 4}" text-anchor="end" font-size="11" font-weight="700" fill="#fff">${pf(lk.c)}</text>`;
  return s + XH(Hh) + `</svg>`;
}

function vol(d) {
  const Hh = VH, bw = PW / d.length, mx = Math.max(...d.map(k => k.v)) || 1;
  return `<svg class="cs" viewBox="0 0 ${CW} ${Hh}">` +
    d.map((k, i) => `<rect x="${i * bw + bw * 0.16}" y="${Hh - k.v / mx * (Hh - 6)}" width="${bw * 0.68}" height="${k.v / mx * (Hh - 6)}" fill="${k.c >= k.o ? UP : DN}" opacity=".8"/>`).join("") +
    `<text class="ax" x="${CW - 3}" y="12" text-anchor="end">${fmtVol(mx)}</text>` + XH(Hh) + `</svg>`;
}

function macd(f, n) {
  const Hh = MH, c = f.map(k => k.c), e12 = ema(c, 12), e26 = ema(c, 26), dif = e12.map((v, i) => v - e26[i]), dea = ema(dif, 9), his = dif.map((v, i) => (v - dea[i]) * 2);
  const D = dif.slice(-n), E = dea.slice(-n), B = his.slice(-n), mx = Math.max(...D.map(Math.abs), ...E.map(Math.abs), ...B.map(Math.abs)) || 1, bw = PW / n, y = v => Hh / 2 - v / mx * (Hh / 2 - 8), pl = a => a.map((v, i) => `${i * bw + bw / 2},${y(v)}`).join(" ");
  return `<svg class="cs" viewBox="0 0 ${CW} ${Hh}"><line class="gl" x1="0" x2="${PW}" y1="${Hh / 2}" y2="${Hh / 2}"/><text class="ax" x="${CW - 3}" y="${Hh / 2 + 4}" text-anchor="end">0</text><text class="ax" x="${CW - 3}" y="12" text-anchor="end">${fmt(mx)}</text><text class="ax" x="${CW - 3}" y="${Hh - 4}" text-anchor="end">−${fmt(mx)}</text>` +
    B.map((v, i) => `<rect x="${i * bw + bw * 0.2}" y="${Math.min(y(v), Hh / 2)}" width="${bw * 0.6}" height="${Math.abs(y(v) - Hh / 2)}" fill="${v >= 0 ? UP : DN}" opacity=".75"/>`).join("") +
    `<polyline fill="none" stroke="#3b82f6" stroke-width="1.4" points="${pl(D)}"/><polyline fill="none" stroke="#f59e0b" stroke-width="1.4" points="${pl(E)}"/>` + XH(Hh) + `</svg>`;
}

function spark(d, ch) {
  d = d.slice(-40).map(k => k.c);
  const lo = Math.min(...d), hi = Math.max(...d);
  return `<svg viewBox="0 0 240 36" preserveAspectRatio="none" style="height:36px;margin-top:6px"><polyline points="${d.map((v, i) => `${i * 240 / (d.length - 1)},${32 - (v - lo) / (hi - lo || 1) * 28}`).join(" ")}" fill="none" stroke="${cc(ch)}" stroke-width="2"/></svg>`;
}

function portfolioStats() {
  const fx = Number(DB.fx_usdtwd) || 32.2;
  let twC = 0, twV = 0, twPrev = 0, usC = 0, usV = 0, usPrev = 0, exitCnt = 0;
  DB.holdings.forEach(h => {
    const Q = quote(h.sym);
    if (exitReasons(h).length) exitCnt++;
    if (!Q) return;
    if (mkt(h.sym) === "TW") {
      twC += h.cost * h.shares; twV += Q.px * h.shares; twPrev += Q.prev * h.shares;
    } else {
      usC += h.cost * h.shares; usV += Q.px * h.shares; usPrev += Q.prev * h.shares;
    }
  });
  const twPL = twV - twC, usPL = usV - usC;
  const totTWD = twV + usV * fx, totCostTWD = twC + usC * fx, totPLTWD = totTWD - totCostTWD;
  const dayChgTWD = (twV - twPrev) + (usV - usPrev) * fx;
  return { fx, twC, twV, twPL, usC, usV, usPL, totTWD, totCostTWD, totPLTWD, dayChgTWD, exitCnt };
}

const sortBy = (a, k, d, M) => [...a].sort((x, y) => {
  const p = M[k](x), q = M[k](y);
  if (p == null) return 1;
  if (q == null) return -1;
  return (typeof p === "string" ? p.localeCompare(q) : p - q) * d;
});

function bindChart() {
  const w = $("#chw"); if (!w || !CH) return;
  const n = CH.d.length;
  const pick = e => {
    const r = w.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * CW;
    if (x < 0 || x > PW) return;
    const i = Math.max(0, Math.min(n - 1, Math.floor(x / (PW / n))));
    document.querySelectorAll("#chw .xh").forEach(l => {
      const px = (i + 0.5) * PW / n;
      l.setAttribute("x1", px); l.setAttribute("x2", px); l.setAttribute("visibility", "visible");
    });
    $("#cinfo").innerHTML = infoHtml(i);
  };
  w.onpointerdown = pick; w.onpointermove = pick;
}

function indCard(Q) {
  const c = Q.d.map(k => k.c), avg = k => c.length >= k ? c.slice(-k).reduce((a, b) => a + b, 0) / k : null;
  const e12 = ema(c, 12), e26 = ema(c, 26), dif = e12.map((v, i) => v - e26[i]), dea = ema(dif, 9), n = c.length - 1, osc = dif[n] - dea[n], po = dif[n - 1] - dea[n - 1];
  const mas = [5, 10, 20, 60, 120, 240].map(k => [k, avg(k)]).filter(x => x[1] != null);
  return `<div class="card"><b>均線與指標乖離率</b><table><tr><th>均線</th><th>數值</th><th>現價乖離</th></tr>${mas.map(([k, v]) => `<tr><td>MA${k}</td><td class="num">${fmt(v)}</td><td>${pct((Q.px / v - 1) * 100)}</td></tr>`).join("")}</table><div class="kv"><div><span class="mu">DIF</span><b>${fmt(dif[n])}</b></div><div><span class="mu">MACD</span><b>${fmt(dea[n])}</b></div><div><span class="mu">OSC 柱體</span><b style="color:${cc(osc)}">${fmt(osc)}</b></div></div><div class="mu" style="margin-top:8px">日 MACD 柱體 ${osc > po ? "▲ 大於" : "▼ 小於"}前一交易日 (${fmt(po)})</div></div>`;
}

function indexDetail(sym) {

  if (!Q) return `<div class="card">${esc(x.name)} 尚無資料</div>`;
  const S = Q[TF] || Q.d, d = S.slice(-N[TF]), ch = (Q.px / Q.prev - 1) * 100, g = GOV[x.m] === sym;
  const head = `<div class="card"><div class="row"><b style="font-size:22px">${esc(x.name)} <span class="mu">${esc(sym)}</span></b>${g && x.regime ? rgChip(x.regime) : ""}</div><div class="big" style="margin-top:6px">${fmt(Q.px)} <span style="font-size:16px;color:${cc(ch)}">${ch >= 0 ? "▲" : "▼"} ${fmt(Math.abs(ch))}%</span></div><div class="mu" style="margin-top:4px">資料基準日：${esc(x.asof || "")}</div></div>`;
  return `<div class="dgrid"><div class="dl">${head}${chartCard(S, d, [])}</div><div class="dr dr-sticky">${indCard(Q)}</div></div>`;
}

function detail(sym) {
  if (DB.indices[sym]) return indexDetail(sym);
  const h = held(sym), Q = quote(sym);
  if (!Q) return `<div class="dgrid"><div class="dl"><div class="card">${esc(nameOf(sym))} 目前還沒有行情資料。填好右側資料並儲存後，按右上角「更新資料」即可取得線圖。</div></div><div class="dr">${tagCard(sym)}${editor(sym, h)}</div></div>`;
  const S = Q[TF] || Q.d, d = S.slice(-N[TF]), ch = (Q.px / Q.prev - 1) * 100, m = mkt(sym), w0 = DB.watchlist.find(x => x.sym === sym), tg = (h || w0 || {}).tag;

  let head = `<div class="card">
    <div class="row">
      <div><b style="font-size:22px">${esc(nameOf(sym))}</b> <span class="mu" style="font-size:15px">${esc(sym)}</span> ${tg ? `<span class="chip">${esc(tg)}</span>` : ""} ${h ? `<span class="chip ${stat(h, Q.px)[0]}">${stat(h, Q.px)[1]}</span>` : `<span class="chip mu-chip">觀察中</span>`}</div>
      <div class="row" style="gap:8px">
        <button class="btn" id="open-dr-edit">${h ? "✎ 快速編輯部位" : "＋ 加入持股"}</button>
      </div>
    </div>
    <div class="big" style="margin-top:6px">${cur(m)}${fmt(Q.px)} <span style="font-size:16px;color:${cc(ch)}">${ch >= 0 ? "▲" : "▼"} ${fmt(Math.abs(ch))}%</span></div>`;

  if (h) {
    const pl = (Q.px - h.cost) * h.shares;
    head += `<div class="kv">
      <div><span class="mu">平均成本</span><b>${fmt(h.cost)}</b></div>
      <div><span class="mu">持有股數</span><b>${fmt(h.shares, 0)}</b></div>
      <div><span class="mu">目前市值</span><b>${cur(m)}${fmt(Q.px * h.shares, 0)}</b></div>
      <div><span class="mu">未實現損益</span><b style="color:${cc(pl)}">${cur(m)}${sgn(pl, m === "TW" ? 0 : 2)}</b></div>
      <div><span class="mu">報酬率</span><b style="color:${cc(pl)}">${sgn((Q.px / h.cost - 1) * 100)}%</b></div>
      <div><span class="mu">距硬停損</span><b>${!h.stop ? "未設定" : Q.px > h.stop ? fmt((Q.px / h.stop - 1) * 100) + "%" : "已跌破"}</b></div>
    </div>`;
  }
  head += `</div>`;

  let posCard = "";
  if (h) {
    const rg = h.tp - h.stop, pos = Math.max(0, Math.min(100, (Q.px - h.stop) / rg * 100)), cp = Math.max(0, Math.min(100, (h.cost - h.stop) / rg * 100));
    posCard = `<div class="card">
      <b>停損與停利位階尺</b>
      <div class="kv">
        <div><span class="mu">預計停損</span><b style="color:var(--st)">${fmt(h.stop)}</b></div>
        <div><span class="mu">預計停利</span><b style="color:var(--tpc)">${fmt(h.tp)}</b></div>
        <div><span class="mu">區間位階</span><b>${fmt(pos, 0)}%</b></div>
      </div>
      <div class="bar"><i style="left:calc(${cp}% - 2px);opacity:.35" title="成本價"></i><i style="left:calc(${pos}% - 2px)" title="現價"></i></div>
      <div class="row mu"><span>停損 ${fmt(h.stop)}</span><span>淡色指標為成本</span><span>停利 ${fmt(h.tp)}</span></div>
      ${h.why ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)"><b>買進理由：</b><span class="mu">${esc(h.why)}</span></div>` : ""}
      ${h.rule ? `<div style="margin-top:4px"><b>出場備註：</b><span class="mu">${esc(h.rule)}</span></div>` : ""}
    </div>`;
  }

  const rightTabs = `<div class="seg" style="width:100%;display:flex">
    <button data-dtab="strat" class="${DTAB === "strat" ? "on" : ""}" style="flex:1">策略與指標檢核</button>
    <button data-dtab="edit" class="${DTAB === "edit" ? "on" : ""}" style="flex:1">${h ? "編輯持股設定" : "加入持股設定"}</button>
  </div>`;

  const rightContent = DTAB === "edit" ? (tagCard(sym) + editor(sym, h)) : (posCard + stratCard(sym, h) + indCard(Q) + tagCard(sym));

  return `<div class="dgrid">
    <div class="dl">${head}${chartCard(S, d, lines(h, h ? ex(h) : null))}<div class="cols2">${revCard(sym)}${newsCard(sym, Q)}</div></div>
    <div class="dr dr-sticky">${rightTabs}${rightContent}</div>
  </div>`;
}

const goBack = () => {
  const st = typeof history !== "undefined" && history.state;
  if (sel) { if (st && st.d) history.back(); else { sel = null; render(); } }
  else if (tab !== "home") { if (st && st.t) history.back(); else { tab = "home"; render(); } }
};
try { window.onpopstate = () => { if (sel) sel = null; else if (tab !== "home") tab = "home"; render(); }; } catch (e) {}

const TITLES = { home: "總覽儀表板", hold: "持股部位管理", watch: "策略觀察清單", set: "系統與連線設定" };

function render() {
  updateSidebarBadges();
  $("#ttl").textContent = sel ? (DB.indices[sel] ? `指數詳情・${nameOf(sel)}` : `個股終端・${nameOf(sel)} (${sel})`) : TITLES[tab];
  const hb = $("#hb");
  if (hb) { hb.hidden = !(sel || tab !== "home"); hb.textContent = sel ? "← 返回" + TITLES[tab] : "← 返回總覽"; }
  document.querySelectorAll("#side [data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === tab && !sel));
  const ui = $("#updinfo");
  if (ui && DB) ui.textContent = "資料更新：" + DB.updated + " (台北)" + (DB.sample ? "・範例資料" : "");
  const vi = $("#verinfo");
  if (vi) vi.textContent = VER;
  const ub = $("#upd");
  if (ub) { ub.textContent = UPD || "更新資料"; ub.disabled = !!UPD; }

  $("#app").innerHTML = msgHtml() + (sel ? detail(sel) : tab === "home" ? home() : tab === "watch" ? watchPage() : tab === "set" ? settingsPage() : list());

  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mk = b.dataset.m; render(); });
  document.querySelectorAll("[data-go-hold]").forEach(b => b.onclick = () => { mk = b.dataset.goHold; tab = "hold"; sel = null; render(); scrollTo(0, 0); });
  document.querySelectorAll(".item[data-s], .alloc-seg[data-s], .alloc-legend span[data-s]").forEach(b => b.onclick = e => {
    if (e.target.closest("button")) return;
    open(b.dataset.s);
  });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const s = b.dataset.edit;
    openDrawer(editor(s, held(s), true));
  });
  document.querySelectorAll("[data-quick-hold]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const s = b.dataset.quickHold;
    openDrawer(editor(s, held(s), true));
  });
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { tab = b.dataset.nav; sel = null; render(); scrollTo(0, 0); });
  document.querySelectorAll("[data-sort]").forEach(h => h.onclick = () => {
    const [p, k] = h.dataset.sort.split(":");
    SORT[p] = SORT[p][0] === k ? [k, -SORT[p][1]] : [k, k === "name" || k === "tag" ? 1 : -1];
    render();
  });

  const on = (i, f) => { const e = $(i); if (e) e.onclick = f; };
  on("#bk", goBack); bindChart(); on("#svt", saveTag); on("#upd", refreshData); on("#hb", goBack);
  on("#sv", () => saveHolding(sel)); on("#rm", () => removeHolding(sel)); on("#rmw", () => removeWatch(sel));
  on("#gs", saveGH); on("#gt", testGH); on("#gc", clearGH);
  on("#qadd-btn", () => openDrawer(quickAddDrawerHtml()));
  on("#open-hold-add", () => openDrawer(quickAddDrawerHtml()));
  on("#open-watch-add", () => openDrawer(quickAddDrawerHtml()));
  on("#open-dr-edit", () => openDrawer(editor(sel, held(sel), true)));

  const hf = $("#hold-filter");
  if (hf) {
    hf.oninput = e => {
      QFILTER = e.target.value.trim().toLowerCase();
      const pos = e.target.selectionStart;
      render();
      const nextHf = $("#hold-filter");
      if (nextHf) { nextHf.focus(); nextHf.setSelectionRange(pos, pos); }
    };
  }

  document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { TF = b.dataset.tf; render(); });
  document.querySelectorAll("[data-wf]").forEach(b => b.onclick = () => { WF = b.dataset.wf; render(); });
  document.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { RV = b.dataset.rv; render(); });
  document.querySelectorAll("[data-dtab]").forEach(b => b.onclick = () => { DTAB = b.dataset.dtab; render(); });
}

function open(s) {
  sel = s; DTAB = "strat";
  $("#rs").innerHTML = ""; $("#q").value = "";
  try { history.pushState({ d: 1 }, ""); } catch (e) {}
  render(); scrollTo(0, 0);
}

/* 搜尋與快捷鍵 */
function hits(v) {
  v = v.trim().toLowerCase(); if (!v) return [];
  const u = [...DB.holdings, ...DB.watchlist.filter(w => !held(w.sym))];
  return u.filter(x => x.sym.toLowerCase().includes(v) || (x.name || "").toLowerCase().includes(v)).slice(0, 10);
}
$("#q").oninput = e => {
  const r = hits(e.target.value), v = e.target.value.trim();
  $("#rs").innerHTML = !v ? "" : r.length ? r.map(x => `<div data-s="${esc(x.sym)}"><span><b>${esc(x.sym)}</b> ${esc(x.name || "")}</span><span>${held(x.sym) ? '<span class="chip">持股</span>' : '<span class="chip mu-chip">觀察</span>'}</span></div>`).join("") : `<div class="mu">不在追蹤清單。點右上角「＋ 快速新增」加入後即可搜尋。</div>`;
  document.querySelectorAll("#rs [data-s]").forEach(b => b.onclick = () => open(b.dataset.s));
};
$("#q").onkeydown = e => { if (e.key === "Enter") { const r = hits(e.target.value); if (r[0]) open(r[0].sym); } };

window.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(tag)) {
    e.preventDefault(); $("#q").focus();
  } else if (e.key === "Escape") {
    if ($("#drawer-mask").classList.contains("open")) closeDrawer();
    else if ($("#rs").innerHTML) { $("#rs").innerHTML = ""; $("#q").blur(); }
    else if (sel) goBack();
  }
});

document.querySelectorAll("#side [data-t]").forEach(b => b.onclick = () => {
  const t = b.dataset.t;
  if (t !== "home" && tab === "home") { try { history.pushState({ t: 1 }, ""); } catch (e) {} }
  tab = t; sel = null; render(); scrollTo(0, 0);
});

let rz;
try { window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (DB && sel && document.querySelector("#chw")) render(); }, 200); }); } catch (e) {}

(async () => {
  try {
    const [d, hj] = await Promise.all([
      fetch("data/data.json?" + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); }),
      (gh().t ? readCfg().then(x => x.cfg).catch(() => null) : Promise.resolve(null)).then(c => c || fetch("holdings.json?" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null))
    ]);
    DB = d;
    if (hj) { DB.holdings = hj.holdings || []; DB.watchlist = hj.watchlist || []; }
    DB.holdings = DB.holdings || []; DB.watchlist = DB.watchlist || [];
    render();
  } catch (e) {
    $("#app").innerHTML = `<div class="card"><b>讀不到 data/data.json</b><p class="mu">請透過 GitHub Pages 或本機伺服器開啟 (python -m http.server)，直接雙擊 HTML 檔案無法讀取 JSON。</p></div>`;
  }
})();
</script>
</body>
</html>
