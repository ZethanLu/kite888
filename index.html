<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STOCK WEB 持股儀表板</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;color-scheme:light;--bg:#f1f3f8;--card:#fff;--tx:#1b2330;--mu:#6b7686;--ac:#0f9d83;--acbg:#dff4ef;--r:#e0453a;--g:#12a36b;--st:#ea7c1e;--tpc:#8b5cf6;--bd:#e3e7ee;--warnbg:#fff1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--mu:#93a0b0;--ac:#35c7a8;--acbg:#16352e;--r:#ff6b5f;--g:#3dd68c;--bd:#2a3441;--warnbg:#3b2a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--mu:#93a0b0;--ac:#35c7a8;--acbg:#16352e;--r:#ff6b5f;--g:#3dd68c;--bd:#2a3441;--warnbg:#3b2a14}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 18px;display:flex;gap:12px;align-items:baseline}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.logo{color:var(--ac);font-weight:800;letter-spacing:.12em}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700;line-height:1.2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{margin:16px 2px 8px;font-weight:700}
.note{background:var(--acbg);color:var(--ac);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.note.w{background:var(--warnbg);color:var(--st)}
.alert{background:var(--warnbg);border-radius:12px;padding:12px;margin-top:10px}.alert b{color:var(--st)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--acbg);color:var(--ac);white-space:nowrap}
.chip.bad{background:var(--warnbg);color:var(--st)}
.seg{display:flex;gap:6px;margin-bottom:12px}
button,input{font:inherit;color:var(--tx)}
.seg button,.back{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 16px;cursor:pointer}
.seg button.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
input{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:8px 10px}
.item,.rs div{cursor:pointer}.rs div{padding:8px 4px;border-top:1px solid var(--bd)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px}.kv b{display:block;font-size:16px}
.bar{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--st),var(--bd) 35%,var(--bd) 65%,var(--tpc));margin:22px 0 6px}
.bar i{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--tx)}
ul{margin:6px 0 0;padding-left:18px}li{margin:6px 0}a{color:var(--ac)}
svg{width:100%;height:auto;display:block}.gl{stroke:var(--bd);stroke-width:.5}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:240px;border:0;background:none;color:var(--mu);padding:10px 0 12px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
select{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:8px 10px;font:inherit;color:var(--tx)}
details summary{cursor:pointer}
input[type=checkbox]{width:auto;margin-right:6px}
.ed .ck label{display:block;font-size:14px;color:var(--tx);margin:4px 0}.ed .ck>label:first-child{font-size:12px;color:var(--mu);margin:0 0 2px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:400;font-size:12px}tr+tr td{border-top:1px solid var(--bd)}
.chip.r{background:color-mix(in srgb,var(--r) 15%,transparent);color:var(--r)}.chip.g{background:color-mix(in srgb,var(--g) 15%,transparent);color:var(--g)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 16px;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:8px 10px;font:inherit;color:var(--tx)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ed label{font-size:12px;color:var(--mu)}.ed .f{grid-column:1/-1}
</style>
</head>
<body>
<header><span class="logo">STOCK WEB</span><b id="ttl">總覽</b><button class="back" id="hb" hidden style="margin-left:auto">← 返回</button></header>
<main><div class="card" style="padding:10px"><input id="q" placeholder="搜尋個股:代號或名稱,例如 2330、台積電、NVDA" autocomplete="off"><div class="rs" id="rs"></div></div><div id="app"></div></main>
<nav><button data-t="home" class="on">總覽</button><button data-t="hold">持股</button><button data-t="watch">觀察</button></nav>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
const mkt=s=>/\.TWO?$|^\^TW/.test(s)?"TW":"US",cur=m=>m==="TW"?"NT$":"US$";
const cc=v=>v>=0?"var(--r)":"var(--g)",sgn=v=>(v>=0?"+":"−")+fmt(Math.abs(v));
const UP="var(--r)",DN="var(--g)";
const N={d:60,w:52,m:36},TFN={d:"日 K",w:"週 K",m:"月 K"},TFU={d:"日",w:"週",m:"個月"};let TF="d",RV=null;const VER="v13-觀察標記";let UPD="",WF="all";const TAGS=["打工型","上班型","老闆型","市值排列","其他"];
const RS={"stop": [["m_osc_down", "月 MACD 柱體比上月差"], ["w_osc_down", "週 MACD 柱體比上週差(週五判斷)"], ["w_close_down", "週收盤比上週差(週五判斷)"], ["below_w5", "收盤跌破 5 週均線"], ["below_ma20", "收盤跌破 20 日線"], ["below_ma60", "收盤跌破 60 日線(季線)"], ["below_ma120", "收盤跌破 120 日線(半年線)"], ["below_prev_wlow", "收盤跌破上週最低點"], ["below_entry_low", "收盤跌破進場日低點"], ["loss5", "虧損達 -5%"]], "tp": [["w_close_down", "週收盤比上週差(週五判斷)"], ["w_high_fail", "當週最高價未創前週新高(週五判斷)"], ["w_osc_down", "週 MACD 柱體比上週差(週五判斷)"], ["m_osc_down", "月 MACD 柱體比上月差"], ["below_ma5", "收盤跌破 5 日線"], ["below_w5", "收盤跌破 5 週均線"], ["fall_back", "獲利跌回門檻(保本)"]]};
const RG={STRONG_WIND:"強風",CHOPPY:"亂流",GUST:"陣風",NO_WIND:"無風"},RGT={STRONG_WIND:"勝率偏高的行情",CHOPPY:"行情震盪,嚴守紀律",GUST:"開始起風,嘗試交易",NO_WIND:"勝率很低,多做多賠!"},GOV={TW:"^TWOII",US:"^SOX"};
const rgChip=r=>`<span class="chip ${r==="STRONG_WIND"||r==="GUST"?"r":"g"}">${RG[r]}</span>`;
const RGN={STRONG_WIND:"老闆型、上班族型全策略可用",CHOPPY:"老闆型分 5 筆以上,上班族型降級或觀望",GUST:"開始起風,可用小部位嘗試",NO_WIND:"僅限老闆型「廉價收購」,上班族型暫停"};
const ST={A:"老闆型・週拉回風箏",B:"老闆型・廉價收購",C:"上班族型・週趨勢風箏",D:"上班族型・強勢週風箏"};
const LV={LEVEL_1:"營收創歷史新高",LEVEL_2:"爆發成長(YoY ≥ 100%)",LEVEL_3:"穩定門檻(YoY ≥ 30%)",FILTER_OUT:"YoY < 30%(排除)"};
const rgOf=sym=>(DB.indices[GOV[mkt(sym)]]||{}).regime;
const allowed=sym=>rgOf(sym)==="NO_WIND"?["B"]:["A","B","C","D"];
const ex=h=>(DB.stocks[h.sym]||{}).exit;
const exitReasons=h=>{const e=ex(h),Q=quote(h.sym);return e&&e.reasons?e.reasons:Q&&Q.px<=h.stop?["跌破預計停損價"]:[]};
let DB=null,tab="home",mk="TW",sel=null,MSG=null;
/* GitHub 寫回:直接修改 repo 內的 holdings.json */
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function gh(){let o="",r="";if(typeof location!=="undefined"&&location.hostname.endsWith(".github.io")){o=location.hostname.split(".")[0];r=location.pathname.split("/")[1]||""}
return{o:LS.get("gh_o")||o,r:LS.get("gh_r")||r,b:LS.get("gh_b")||"main",t:LS.get("gh_t")||""}}
const b64e=s=>{let b="";new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
async function api(path,opt={}){const g=gh();if(!g.t||!g.o||!g.r)throw new Error("請先在總覽頁最下方設定 GitHub 連線(帳號、repo 與存取權杖)");
const isGet=!opt.method,res=await fetch(`https://api.github.com/repos/${g.o}/${g.r}/${path}${isGet?(path.includes("?")?"&":"?")+"_="+Date.now():""}`,{...opt,cache:"no-store",headers:{Authorization:`Bearer ${g.t}`,Accept:opt.accept||"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}});
if(!res.ok){let d="";try{d=(await res.json()).message||""}catch(x){}const e=new Error((res.status===401?"權杖無效或已過期":res.status===403||res.status===404?"沒有權限或找不到 repo,請檢查權杖權限與 repo 名稱":res.status===409?"檔案剛被更新過,請重新整理頁面後再試一次":`GitHub 回應 ${res.status}`)+(d?`(${d})`:""));e.status=res.status;throw e}
return res.status===204?null:res.json()}
async function readCfg(){const j=await api(`contents/holdings.json?ref=${encodeURIComponent(gh().b)}`);const cfg=JSON.parse(b64d(j.content));cfg.holdings=cfg.holdings||[];cfg.watchlist=cfg.watchlist||[];return{cfg,sha:j.sha}}
async function mutate(fn,msg){for(let k=0;k<3;k++){const{cfg,sha}=await readCfg();fn(cfg);
try{await api("contents/holdings.json",{method:"PUT",body:JSON.stringify({message:msg,content:b64e(JSON.stringify(cfg,null,2)+"\n"),sha,branch:gh().b})});return cfg}catch(e){if((e.status!==409&&e.status!==422)||k>=2)throw e;await new Promise(r=>setTimeout(r,900))}}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function refreshData(){if(UPD)return;const set=t=>{UPD=t;const b=$("#upd");if(b){b.textContent=t||"更新資料";b.disabled=!!t}},runs=()=>api("actions/workflows/update-data.yml/runs?per_page=1").then(j=>(j.workflow_runs||[])[0]);
try{set("送出中…");const prev=await runs();await api("actions/workflows/update-data.yml/dispatches",{method:"POST",body:JSON.stringify({ref:gh().b})});set("更新中(約 1–3 分鐘)…");let run=null;
for(let i=0;i<45;i++){await sleep(8000);const r=await runs();if(r&&(!prev||r.id!==prev.id)){run=r;if(r.status==="completed")break}}
if(!run||run.status!=="completed"){set("");say("更新還在進行中,請稍後重新整理頁面。",1);return render()}
if(run.conclusion!=="success"){set("");say("更新失敗("+run.conclusion+"),請到 GitHub 的 Actions 頁面查看 log。",1);return render()}
const j=await api(`contents/data/data.json?ref=${encodeURIComponent(gh().b)}`,{accept:"application/vnd.github.raw+json"});
DB=j;DB.holdings=DB.holdings||[];DB.watchlist=DB.watchlist||[];set("");say("資料已更新。");render()}
catch(e){set("");say("更新失敗:"+e.message+(e.status===403||e.status===404?"(請確認 token 的 Actions 權限為 Read and write)":""),1);render()}}
const say=(t,w)=>{MSG={t,w}};
function msgHtml(){const m=MSG;MSG=null;return m?`<div class="note${m.w?" w":""}">${esc(m.t)}</div>`:""}
async function run(fn,needData,okText){try{const cfg=await fn();DB.holdings=cfg.holdings;DB.watchlist=cfg.watchlist;let t=okText||"已儲存到 GitHub。";
if(needData)t+=" 要取得新資料(價格、線圖、營收、新聞、策略評估),請按頁面上的「更新資料」按鈕。";say(t)}catch(e){say("儲存失敗:"+e.message,1)}render()}
function editor(sym,h){const inW=DB.watchlist.some(w=>w.sym===sym),v=k=>h&&h[k]!=null?esc(h[k]):"";
return `<div class="card" id="edcard"><b>${h?"編輯持股":"加入持股"}</b><div class="ed"><div><label>名稱</label><input id="e_n" value="${esc(nameOf(sym))}"></div><div><label>股數</label><input id="e_sh" type="number" step="any" value="${v("shares")}"></div><div><label>成本價</label><input id="e_cost" type="number" step="any" value="${v("cost")}"></div><div><label>預計停損價</label><input id="e_stop" type="number" step="any" value="${v("stop")}"></div><div><label>預計停利價</label><input id="e_tp" type="number" step="any" value="${v("tp")}"></div><div><label>策略</label><select id="e_st"><option value="">未指定</option>${["A","B","C","D"].map(k=>`<option value="${k}"${h&&h.strategy===k?" selected":""}>${k}・${ST[k]}</option>`).join("")}</select></div><div><label>進場日期</label><input id="e_ed" type="date" value="${v("entry_date")}"></div><div class="f"><label>買進原因</label><textarea id="e_why" rows="2">${v("why")}</textarea></div><div class="f"><label>出場規則(備註)</label><input id="e_rule" value="${v("rule")}"></div><div class="f ck"><label>自訂停損條件(任一觸發即出場)</label>${RS.stop.map(([id,lb])=>`<label><input type="checkbox" name="rs" value="${id}"${h&&h.rules&&(h.rules.stop||[]).includes(id)?" checked":""}>${esc(lb)}</label>`).join("")}</div><div class="f ck"><label>自訂停利條件(獲利達門檻後,任一觸發即出場)</label>${RS.tp.map(([id,lb])=>`<label><input type="checkbox" name="rt" value="${id}"${h&&h.rules&&(h.rules.tp||[]).includes(id)?" checked":""}>${esc(lb)}</label>`).join("")}</div><div><label>停利啟用的獲利門檻 %</label><input id="e_ta" type="number" step="any" placeholder="10" value="${v("tp_after")}"></div></div><div class="row" style="margin-top:12px"><button class="btn p" id="sv">儲存到 GitHub</button>${h?`<button class="btn" id="rm">移除持股</button>`:inW?`<button class="btn" id="rmw">移除觀察</button>`:""}</div><div class="mu" style="margin-top:8px">儲存會直接修改 repo 裡的 holdings.json。策略 D 的時間停損、進場日低點,以及放風箏階段的最高損益,都需要填進場日期才算得準。</div></div>`}
let GOEDIT=false;
const newHoldForm=()=>`<div class="card"><b>新增持股</b><div class="mu" style="margin:6px 0">輸入代號與名稱,下一步填股數、成本、停損停利和策略。台股 4 碼數字預設為上市(.TW),上櫃請輸入 .TWO。</div><div class="ed"><div><label>代號</label><input id="nh_s" placeholder="2308 或 NVDA"></div><div><label>名稱(選填)</label><input id="nh_n" placeholder="台達電"></div></div><button class="btn p" id="nh" style="margin-top:10px">新增並編輯</button></div>`;
function newHolding(){let s=$("#nh_s").value.trim().toUpperCase();const n=$("#nh_n").value.trim();if(!s)return;if(/^\d{4,6}[A-Z]?$/.test(s))s+=".TW";if(n)TMP[s]=n;GOEDIT=true;open(s)}
const watchForm=()=>`<div class="card"><b>新增觀察個股</b><div class="mu" style="margin:6px 0">加入後就能搜尋。台股 4 碼數字預設為上市(.TW),上櫃請輸入 .TWO,例如 6488.TWO。</div><div class="ed"><div><label>代號</label><input id="w_s" placeholder="2454 或 NVDA"></div><div><label>名稱(選填)</label><input id="w_n" placeholder="聯發科"></div>${tagFields("w")}</div><button class="btn p" id="aw" style="margin-top:10px">加入觀察清單</button></div>`;
function settings(){const g=gh();return `<div class="card"><b>GitHub 連線(編輯持股用)</b><div class="mu" style="margin:6px 0">權杖只存在這個瀏覽器。請建立只限這個 repo 的 fine-grained token:Contents 設為 Read and write;Actions 也要設為 Read and write,「更新資料」按鈕才能使用。</div><div class="ed"><div><label>帳號</label><input id="g_o" value="${esc(g.o)}"></div><div><label>Repo</label><input id="g_r" value="${esc(g.r)}"></div><div><label>分支</label><input id="g_b" value="${esc(g.b)}"></div><div><label>存取權杖</label><input id="g_t" type="password" autocomplete="off" placeholder="${g.t?"已設定,留白表示不變":"貼上 token"}"></div></div><div class="row" style="margin-top:10px"><button class="btn p" id="gs">儲存設定</button><button class="btn" id="gt">測試連線</button><button class="btn" id="gc">清除權杖</button></div></div>`}
function saveHolding(){const g=i=>$("#e_"+i).value.trim(),n=i=>parseFloat(g(i));
const prev=held(sel)||{},wl=DB.watchlist.find(x=>x.sym===sel)||{},o={...(prev.sym?{}:{...(wl.tag?{tag:wl.tag}:{}),...(wl.tag_note?{tag_note:wl.tag_note}:{})}),...prev,sym:sel,name:g("n")||nameOf(sel),shares:n("sh"),cost:n("cost"),stop:n("stop"),tp:n("tp"),why:g("why"),rule:g("rule"),strategy:g("st"),entry_date:g("ed"),tp_after:n("ta")};if(!o.strategy)delete o.strategy;if(!o.entry_date)delete o.entry_date;if(!(o.tp_after>0))delete o.tp_after;
const ck=nm=>[...document.querySelectorAll(`#edcard input[name=${nm}]:checked`)].map(x=>x.value),rl={stop:ck("rs"),tp:ck("rt")};if(rl.stop.length||rl.tp.length)o.rules=rl;else delete o.rules;
if(!(o.shares>0&&o.cost>0&&o.stop>0&&o.tp>o.stop)){say("請確認股數、成本、停損、停利都有填,且停利要大於停損。",1);return render()}
run(()=>mutate(cfg=>{const i=cfg.holdings.findIndex(h=>h.sym===o.sym);i<0?cfg.holdings.push(o):cfg.holdings[i]=o;cfg.watchlist=cfg.watchlist.filter(w=>w.sym!==o.sym)},`holdings: ${o.sym}`),!DB.stocks[o.sym]||prev.strategy!==o.strategy||prev.entry_date!==o.entry_date||prev.cost!==o.cost||prev.tp_after!==o.tp_after||JSON.stringify(prev.rules)!==JSON.stringify(o.rules))}
function removeHolding(){if(!confirm("確定移除這檔持股?"))return;const s=sel;sel=null;tab="hold";run(()=>mutate(cfg=>{cfg.holdings=cfg.holdings.filter(h=>h.sym!==s)},`holdings: remove ${s}`),false,"已移除持股。")}
function removeWatch(){const s=sel;sel=null;tab="hold";run(()=>mutate(cfg=>{cfg.watchlist=cfg.watchlist.filter(w=>w.sym!==s)},`watchlist: remove ${s}`),false,"已移除觀察個股。")}

function agg(d,k){const g=[];let key=null;for(const x of d){const kk=k==="w"?Math.floor((x.t/86400+3)/7):new Date(x.t*1000).toISOString().slice(0,7);if(kk!==key){g.push({...x});key=kk}else{const y=g[g.length-1];y.h=Math.max(y.h,x.h);y.l=Math.min(y.l,x.l);y.c=x.c;y.v+=x.v}}return g}

function kline(d,ln){const W=340,Hh=180,bw=W/d.length,m20=ma(d.map(k=>k.c),20);ln=ln.filter(l=>Number.isFinite(l.y)&&l.y>0);
const all=d.flatMap(k=>[k.h,k.l]).concat(ln.map(l=>l.y)),lo=Math.min(...all)*.995,hi=Math.max(...all)*1.005,y=v=>4+(hi-v)/(hi-lo)*(Hh-8);
let s=`<svg viewBox="0 0 ${W} ${Hh}">`;for(let i=1;i<4;i++)s+=`<line class="gl" x1="0" x2="${W}" y1="${Hh/4*i}" y2="${Hh/4*i}"/>`;
d.forEach((k,i)=>{const x=i*bw+bw/2,c=k.c>=k.o?UP:DN;s+=`<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${c}"/><rect x="${x-bw*.32}" y="${y(Math.max(k.o,k.c))}" width="${bw*.64}" height="${Math.max(1,Math.abs(y(k.o)-y(k.c)))}" fill="${c}"/>`});
s+=`<polyline fill="none" stroke="#e8a317" stroke-width="1.2" points="${m20.map((v,i)=>v==null?"":`${i*bw+bw/2},${y(v)}`).join(" ")}"/>`;
ln.forEach(l=>s+=`<line x1="0" x2="${W}" y1="${y(l.y)}" y2="${y(l.y)}" stroke="${l.c}" stroke-dasharray="4 3"/><text x="${W-2}" y="${y(l.y)-2}" text-anchor="end" font-size="9" fill="${l.c}">${l.t} ${fmt(l.y)}</text>`);return s+`</svg>`}
function vol(d){const W=340,Hh=50,bw=W/d.length,mx=Math.max(...d.map(k=>k.v))||1;return `<svg viewBox="0 0 ${W} ${Hh}">`+d.map((k,i)=>`<rect x="${i*bw+bw*.18}" y="${Hh-k.v/mx*Hh}" width="${bw*.64}" height="${k.v/mx*Hh}" fill="${k.c>=k.o?UP:DN}" opacity=".8"/>`).join("")+`</svg>`}
function macd(f,n){const W=340,Hh=80,c=f.map(k=>k.c),e12=ema(c,12),e26=ema(c,26),dif=e12.map((v,i)=>v-e26[i]),dea=ema(dif,9),his=dif.map((v,i)=>(v-dea[i])*2);
const D=dif.slice(-n),E=dea.slice(-n),B=his.slice(-n),mx=Math.max(...D.map(Math.abs),...E.map(Math.abs),...B.map(Math.abs))||1,bw=W/n,y=v=>Hh/2-v/mx*(Hh/2-4),pl=a=>a.map((v,i)=>`${i*bw+bw/2},${y(v)}`).join(" ");
return `<svg viewBox="0 0 ${W} ${Hh}"><line class="gl" x1="0" x2="${W}" y1="${Hh/2}" y2="${Hh/2}"/>`+B.map((v,i)=>`<rect x="${i*bw+bw*.2}" y="${Math.min(y(v),Hh/2)}" width="${bw*.6}" height="${Math.abs(y(v)-Hh/2)}" fill="${v>=0?UP:DN}" opacity=".75"/>`).join("")+`<polyline fill="none" stroke="#3b82f6" stroke-width="1.2" points="${pl(D)}"/><polyline fill="none" stroke="#e8a317" stroke-width="1.2" points="${pl(E)}"/></svg>`}
function spark(d,ch){d=d.slice(-40).map(k=>k.c);const lo=Math.min(...d),hi=Math.max(...d);return `<svg viewBox="0 0 340 38" preserveAspectRatio="none" style="height:38px"><polyline points="${d.map((v,i)=>`${i*340/(d.length-1)},${34-(v-lo)/(hi-lo||1)*30}`).join(" ")}" fill="none" stroke="${cc(ch)}" stroke-width="2"/></svg>`}

return s+`</div>`}
function home(){let s=banner();
["TW","US"].forEach(m=>{s+=`<div class="sec">${m==="TW"?"台股大盤":"美股大盤"}</div>${rgLine(m)}<div class="grid">`+Object.entries(DB.indices).filter(([,x])=>x.m===m).map(([sym,x])=>{const Q=quote(sym);if(!Q)return"";const ch=(Q.px/Q.prev-1)*100,k=Q.d.at(-1);return `<div class="card item" data-s="${esc(sym)}" style="margin:0"><div class="mu">${esc(x.name)} ${GOV[m]===sym&&x.regime?rgChip(x.regime):""}</div><div class="big">${fmt(Q.px)}</div><div style="color:${cc(ch)};font-weight:600">${ch>=0?"▲":"▼"} ${fmt(Math.abs(ch))}%</div><div class="mu">高 ${fmt(k.h,0)}・低 ${fmt(k.l,0)}</div>${spark(Q.d,ch)}</div>`}).join("")+`</div>`});
s+=`<div class="sec">持股損益</div><div class="grid">`+["TW","US"].map(m=>{let c=0,v=0;DB.holdings.forEach(h=>{const Q=quote(h.sym);if(mkt(h.sym)===m&&Q){c+=h.cost*h.shares;v+=Q.px*h.shares}});const pl=v-c;return `<div class="card" style="margin:0"><div class="mu">${m==="TW"?"台股":"美股"}市值</div><div class="big">${cur(m)}${fmt(v,0)}</div><div style="color:${cc(pl)};font-weight:600">${c?`${sgn(pl)} (${sgn(pl/c*100)}%)`:"尚無持股"}</div></div>`}).join("")+`</div>`;
s+=`<div class="grid" style="margin-top:12px"><button class="btn p" id="gohold">管理持股</button><button class="btn p" id="gowatch">觀察清單 (${DB.watchlist.filter(w=>!held(w.sym)).length})</button></div>`+watchMini();
const hit=DB.holdings.map(h=>({h,r:exitReasons(h)})).filter(x=>x.r.length);
return s+sigCard()+`<div class="card" style="margin-top:14px"><div class="row"><b>持股出場檢查</b><span class="mu">${DB.holdings.length} 檔持股</span></div>`+(hit.length?`<div class="alert"><b>已觸發出場條件</b>${hit.map(({h,r})=>`<div class="item" data-s="${esc(h.sym)}" style="margin-top:6px;cursor:pointer"><b>${esc(h.name)}</b> <span class="mu">${esc(r.join("、"))}</span></div>`).join("")}</div>`:`<div class="mu" style="margin-top:8px">目前沒有觸發出場條件</div>`)+holdRows()+`</div>`+settings()}
function list(){const L=DB.holdings.filter(h=>mkt(h.sym)===mk);
let s=banner()+listSwitch("hold")+newHoldForm()+`<div class="seg"><button data-m="TW" class="${mk==="TW"?"on":""}">台股</button><button data-m="US" class="${mk==="US"?"on":""}">美股</button></div>`;
if(!L.length)s+=`<div class="card mu">這個市場還沒有持股,請編輯 holdings.json。</div>`;
L.forEach(h=>{const Q=quote(h.sym);if(!Q)return s+=`<div class="card item" data-s="${esc(h.sym)}"><b>${esc(h.name)}</b> <span class="mu">${esc(h.sym)} 尚無資料,點開可編輯</span></div>`;
const pl=(Q.px-h.cost)*h.shares,pc=(Q.px/h.cost-1)*100,[k,t]=stat(h,Q.px);
s+=`<div class="card item" data-s="${esc(h.sym)}"><div class="row"><b>${esc(h.name)} <span class="mu">${esc(h.sym)}</span></b><span><span class="chip ${k}">${t}</span> <button class="btn" data-edit="1" style="padding:2px 12px">編輯</button></span></div><div class="row" style="margin-top:8px"><span class="mu">${fmt(h.shares,0)} 股・成本 ${fmt(h.cost)}・${h.strategy?"策略 "+h.strategy:"未指定策略"}</span><span class="big" style="font-size:20px">${fmt(Q.px)}</span></div><div class="row"><span class="mu">未實現損益</span><b style="color:${cc(pl)}">${cur(mkt(h.sym))}${sgn(pl)} (${sgn(pc)}%)</b></div>${revLine(h.sym)}</div>`});return s}
const chartCard=(S,d,L)=>`<div class="card"><b>技術線圖</b> <span class="mu">${TFN[TF]}・近 ${d.length} ${TFU[TF]}・黃線 MA20</span><div class="seg" style="margin:8px 0">${["d","w","m"].map(k=>`<button data-tf="${k}" class="${TF===k?"on":""}">${TFN[k]}</button>`).join("")}</div>${kline(d,L)}<div class="mu" style="margin-top:6px">成交量</div>${vol(d)}<div class="mu" style="margin-top:6px">MACD(12, 26, 9)・藍線 DIF・黃線 DEA</div>${macd(S,d.length)}</div>`;
function indCard(Q){const c=Q.d.map(k=>k.c),avg=k=>c.length>=k?c.slice(-k).reduce((a,b)=>a+b,0)/k:null,e12=ema(c,12),e26=ema(c,26),dif=e12.map((v,i)=>v-e26[i]),dea=ema(dif,9),n=c.length-1,osc=dif[n]-dea[n],po=dif[n-1]-dea[n-1],ma=[5,10,20,60].map(k=>[k,avg(k)]).filter(x=>x[1]!=null);
return `<div class="card"><b>技術指標</b><table><tr><th>均線</th><th>數值</th><th>現價相對</th></tr>${ma.map(([k,v])=>`<tr><td>MA${k}</td><td>${fmt(v)}</td><td>${pct((Q.px/v-1)*100)}</td></tr>`).join("")}</table><div class="kv"><div><span class="mu">DIF</span><b>${fmt(dif[n])}</b></div><div><span class="mu">MACD</span><b>${fmt(dea[n])}</b></div><div><span class="mu">MACD 柱</span><b style="color:${cc(osc)}">${fmt(osc)}</b></div></div><div class="mu" style="margin-top:6px">MACD 柱${osc>po?"大於":"小於"}前一交易日(${fmt(po)})</div></div>`}
function indexDetail(sym){const x=DB.indices[sym],Q=quote(sym);if(!Q)return `<div class="card" style="margin-top:12px">${esc(x.name)} 尚無資料</div>`;
const S=Q[TF]||Q.d,d=S.slice(-N[TF]),ch=(Q.px/Q.prev-1)*100,g=GOV[x.m]===sym;
return `<div class="card" style="margin-top:12px"><div class="row"><b style="font-size:18px">${esc(x.name)} <span class="mu">${esc(sym)}</span></b>${g&&x.regime?rgChip(x.regime):""}</div><div class="big" style="margin-top:6px">${fmt(Q.px)} <span style="font-size:15px;color:${cc(ch)}">${ch>=0?"▲":"▼"} ${fmt(Math.abs(ch))}%</span></div><div class="mu">資料日期 ${esc(x.asof||"")}</div></div>`+(g?rgLine(x.m):"")+chartCard(S,d,[])+indCard(Q)}
function detail(sym){if(DB.indices[sym])return indexDetail(sym);const h=held(sym),Q=quote(sym),back="";
if(!Q)return back+`<div class="card" style="margin-top:12px">${esc(nameOf(sym))} 目前還沒有這檔的行情資料。填好下方資料並儲存後會觸發更新,約 1 到 2 分鐘後出現線圖。</div>`+tagCard(sym)+editor(sym,h);
const S=Q[TF]||Q.d,d=S.slice(-N[TF]),ch=(Q.px/Q.prev-1)*100,m=mkt(sym);
let s=back+`<div class="card" style="margin-top:12px"><div class="row"><b style="font-size:18px">${esc(nameOf(sym))} <span class="mu">${esc(sym)}</span></b><span>${(h||(DB.watchlist.find(x=>x.sym===sym)||{})).tag?`<span class="chip">${esc((h||DB.watchlist.find(x=>x.sym===sym)).tag)}</span> `:""}${h?`<span class="chip ${stat(h,Q.px)[0]}">${stat(h,Q.px)[1]}</span>`:`<span class="chip">觀察中</span>`} <button class="btn" id="goedit" style="padding:2px 12px">${h?"編輯":"加入持股"}</button></span></div><div class="big" style="margin-top:6px">${fmt(Q.px)} <span style="font-size:15px;color:${cc(ch)}">${ch>=0?"▲":"▼"} ${fmt(Math.abs(ch))}%</span></div>`;
if(h){const pl=(Q.px-h.cost)*h.shares;s+=`<div class="kv"><div><span class="mu">持股成本</span><b>${fmt(h.cost)}</b></div><div><span class="mu">持有股數</span><b>${fmt(h.shares,0)}</b></div><div><span class="mu">未實現損益</span><b style="color:${cc(pl)}">${cur(m)}${sgn(pl)}</b></div></div><div class="kv"><div><span class="mu">目前市值</span><b>${fmt(Q.px*h.shares,0)}</b></div><div><span class="mu">報酬率</span><b style="color:${cc(pl)}">${sgn((Q.px/h.cost-1)*100)}%</b></div><div><span class="mu">距停損</span><b>${!h.stop?"未設定":Q.px>h.stop?fmt((Q.px/h.stop-1)*100)+"%":"已跌破"}</b></div></div>`}
s+=`</div>`+stratCard(sym,h);
if(h){const rg=h.tp-h.stop,pos=Math.max(0,Math.min(100,(Q.px-h.stop)/rg*100)),cp=Math.max(0,Math.min(100,(h.cost-h.stop)/rg*100));
s+=`<div class="card"><b>買進原因</b><p style="margin:8px 0 0">${esc(h.why)||"尚未填寫"}</p></div><div class="card"><b>停損與停利</b><div class="kv"><div><span class="mu">預計停損</span><b style="color:var(--st)">${fmt(h.stop)}</b></div><div><span class="mu">預計停利</span><b style="color:var(--tpc)">${fmt(h.tp)}</b></div><div><span class="mu">現價位置</span><b>${fmt(pos,0)}%</b></div></div><div class="bar"><i style="left:calc(${cp}% - 2px);opacity:.35"></i><i style="left:calc(${pos}% - 2px)"></i></div><div class="row mu"><span>停損</span><span>淡色為成本</span><span>停利</span></div><p class="mu" style="margin:10px 0 0">出場規則:${esc(h.rule)||"尚未填寫"}</p></div>`}
s+=`<div class="card"><b>技術線圖</b> <span class="mu">${TFN[TF]}・近 ${d.length} ${TFU[TF]}・黃線 MA20</span><div class="seg" style="margin:8px 0">${["d","w","m"].map(k=>`<button data-tf="${k}" class="${TF===k?"on":""}">${TFN[k]}</button>`).join("")}</div>${kline(d,lines(h,h?ex(h):null))}<div class="mu" style="margin-top:6px">成交量</div>${vol(d)}<div class="mu" style="margin-top:6px">MACD(12, 26, 9)・藍線 DIF・黃線 DEA</div>${macd(S,d.length)}</div>`;
return s+revCard(sym)+newsCard(sym,Q)+tagCard(sym)+editor(sym,h)}
function render(){$("#ttl").textContent=sel?(DB.indices[sel]?"指數":"個股"):{home:"總覽",hold:"持股",watch:"觀察清單"}[tab];
const hb=$("#hb");if(hb){hb.hidden=!(sel||tab!=="home");hb.textContent=sel?"← 返回"+{home:"總覽",hold:"持股",watch:"觀察清單"}[tab]:"← 返回總覽"}
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab&&!sel));
$("#app").innerHTML=msgHtml()+(sel?detail(sel):tab==="home"?home():tab==="watch"?watchPage():list());
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mk=b.dataset.m;render()});
document.querySelectorAll(".item").forEach(b=>b.onclick=()=>open(b.dataset.s));
const on=(i,f)=>{const e=$(i);if(e)e.onclick=f};
on("#bk",goBack);on("#svt",saveTag);on("#upd",refreshData);on("#hb",goBack);on("#sv",saveHolding);on("#rm",removeHolding);on("#rmw",removeWatch);on("#aw",addWatch);on("#gs",saveGH);on("#gt",testGH);on("#gc",clearGH);
on("#goedit",()=>{const e=$("#edcard");if(e)e.scrollIntoView({behavior:"smooth"})});on("#gohold",()=>{try{history.pushState({t:1},"")}catch(e){}tab="hold";sel=null;render();scrollTo(0,0)});on("#gowatch",()=>{try{history.pushState({t:1},"")}catch(e){}tab="watch";sel=null;render();scrollTo(0,0)});
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{tab=b.dataset.nav;sel=null;render();scrollTo(0,0)});on("#nh",newHolding);
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{GOEDIT=true});
document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{TF=b.dataset.tf;render()});
document.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{WF=b.dataset.wf;render()});
document.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{RV=b.dataset.rv;render()});
if(GOEDIT&&sel){GOEDIT=false;const e=$("#edcard");if(e)e.scrollIntoView()}}
function open(s){sel=s;$("#rs").innerHTML="";$("#q").value="";try{history.pushState({d:1},"")}catch(e){}render();scrollTo(0,0)}
/* 搜尋範圍:持股 + watchlist */
function hits(v){v=v.trim().toLowerCase();if(!v)return[];const u=[...DB.holdings,...DB.watchlist.filter(w=>!held(w.sym))];return u.filter(x=>x.sym.toLowerCase().includes(v)||(x.name||"").toLowerCase().includes(v)).slice(0,8)}
$("#q").oninput=e=>{const r=hits(e.target.value),v=e.target.value.trim();$("#rs").innerHTML=!v?"":r.length?r.map(x=>`<div data-s="${esc(x.sym)}"><b>${esc(x.sym)}</b> ${esc(x.name||"")} ${held(x.sym)?'<span class="chip">持股</span>':""}</div>`).join(""):`<div class="mu">不在追蹤清單。請把代號加進 holdings.json 的 watchlist,下次排程更新後即可搜尋。</div>`;
document.querySelectorAll("#rs [data-s]").forEach(b=>b.onclick=()=>open(b.dataset.s))};
$("#q").onkeydown=e=>{if(e.key==="Enter"){const r=hits(e.target.value);if(r[0])open(r[0].sym)}};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t!=="home"&&tab==="home"){try{history.pushState({t:1},"")}catch(e){}}tab=t;sel=null;render();scrollTo(0,0)});
/* 載入:data.json 放行情;持股設定優先從 GitHub 讀最新版(有設定權杖時),否則讀 holdings.json */
(async()=>{try{const [d,hj]=await Promise.all([fetch("data/data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),
(gh().t?readCfg().then(x=>x.cfg).catch(()=>null):Promise.resolve(null)).then(c=>c||fetch("holdings.json?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null))]);
DB=d;if(hj){DB.holdings=hj.holdings||[];DB.watchlist=hj.watchlist||[]}DB.holdings=DB.holdings||[];DB.watchlist=DB.watchlist||[];render()}
catch(e){$("#app").innerHTML=`<div class="card"><b>讀不到 data/data.json</b><p class="mu">請透過 GitHub Pages 或本機伺服器開啟(python -m http.server),直接雙擊檔案無法讀取。</p></div>`}})();
</script>
