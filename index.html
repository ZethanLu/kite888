<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>STOCK WEB 持股儀表板</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{box-sizing:border-box;color-scheme:light;--bg:#f3f5f9;--card:#fff;--tx:#1b2330;--mu:#6b7686;--ac:#0f9d83;--acbg:#dff4ef;--r:#e0453a;--g:#12a36b;--st:#ea7c1e;--tpc:#8b5cf6;--bd:#e3e7ee;--warnbg:#fff1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--mu:#93a0b0;--ac:#35c7a8;--acbg:#16352e;--r:#ff6b5f;--g:#3dd68c;--bd:#2a3441;--warnbg:#3b2a14}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--mu:#93a0b0;--ac:#35c7a8;--acbg:#16352e;--r:#ff6b5f;--g:#3dd68c;--bd:#2a3441;--warnbg:#3b2a14}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.55;min-width:1000px}
#shell{display:flex;min-height:100vh}
#side{width:208px;flex:none;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--bd);padding:20px 12px;display:flex;flex-direction:column}
.brand{color:var(--ac);font-weight:800;letter-spacing:.12em;font-size:16px;padding:2px 12px 20px}
#side nav{display:flex;flex-direction:column;gap:4px}
#side nav button{text-align:left;border:0;background:none;padding:10px 14px;border-radius:8px;color:var(--mu);font:inherit;font-size:14.5px;cursor:pointer}
#side nav button:hover{background:var(--bg);color:var(--tx)}
#side nav button.on{background:var(--acbg);color:var(--ac);font-weight:700}
.sidefoot{margin-top:auto;padding:10px 12px}
#main{flex:1;min-width:0}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 28px;background:var(--card);border-bottom:1px solid var(--bd);min-height:57px}
#ttl{font-size:17px}
.search{position:relative;width:min(460px,38vw)}
.rs{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.16);max-height:360px;overflow:auto;z-index:30}.rs:empty{display:none}
.rs div{padding:9px 14px;border-top:1px solid var(--bd);cursor:pointer}.rs div:first-child{border-top:0}.rs div:hover{background:var(--bg)}
.sp{flex:1}
#app{padding:22px 28px 56px;max-width:1640px}
.card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid var(--bd)}
.card.item:hover{border-color:var(--ac)}
.mu{color:var(--mu);font-size:12.5px}.big{font-size:26px;font-weight:700;line-height:1.25}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.grid>.card{margin:0}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}.dl,.dr{min-width:0}
@media (max-width:1100px){.cols2{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}}
.sec{margin:2px 2px 10px;font-weight:700;font-size:15px}
.note{background:var(--acbg);color:var(--ac);border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:16px}
.note.w{background:var(--warnbg);color:var(--st)}
.alert{background:var(--warnbg);border-radius:10px;padding:12px 14px;margin-top:10px}.alert b{color:var(--st)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--acbg);color:var(--ac);white-space:nowrap}
.chip.bad{background:var(--warnbg);color:var(--st)}
.chip.r{background:color-mix(in srgb,var(--r) 15%,transparent);color:var(--r)}.chip.g{background:color-mix(in srgb,var(--g) 15%,transparent);color:var(--g)}
.seg{display:flex;gap:6px;margin-bottom:14px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.seg button,.back,.btn{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 16px;cursor:pointer}
.seg button:hover,.back:hover,.btn:hover{border-color:var(--ac)}
.seg button.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn:disabled{opacity:.6;cursor:wait}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
input[type=checkbox]{width:auto;margin-right:6px}
.item{cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 12px}.kv b{display:block;font-size:16px}
.bar{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--st),var(--bd) 35%,var(--bd) 65%,var(--tpc));margin:22px 0 6px}
.bar i{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--tx)}
ul{margin:6px 0 0;padding-left:18px}li{margin:6px 0}a{color:var(--ac)}
svg{width:100%;height:auto;display:block}.gl{stroke:var(--bd);stroke-width:.5}
details summary{cursor:pointer}
.dtl{margin-bottom:16px}.dtl>summary{display:inline-block;list-style:none}.dtl>summary::-webkit-details-marker{display:none}.dtl>.card{max-width:720px;margin-top:10px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ed label{font-size:12px;color:var(--mu)}.ed .f{grid-column:1/-1}
.ed .ck label{display:block;font-size:14px;color:var(--tx);margin:4px 0}.ed .ck>label:first-child{font-size:12px;color:var(--mu);margin:0 0 2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 8px;text-align:right}th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:12px;white-space:nowrap}
tr+tr td{border-top:1px solid var(--bd)}
.tbl th,.tbl td{padding:10px 10px}.tbl th.l,.tbl td.l{text-align:left}
.tbl th{position:sticky;top:57px;background:var(--card);z-index:2;border-bottom:1px solid var(--bd)}
.tbl tr.item:hover td{background:var(--bg)}
th[data-sort]{cursor:pointer;user-select:none}th[data-sort]:hover{color:var(--tx)}
.tcard{padding:6px 10px}
.ax{font-size:11px;fill:var(--mu)}.hl{font-size:11px;fill:var(--tx)}.xh{stroke:var(--tx);stroke-width:.8;stroke-dasharray:3 2;opacity:.7}.cinfo{min-height:48px;margin:6px 0 4px}
</style>
</head>
<body>
<div id="shell">
<aside id="side"><div class="brand">STOCK WEB</div>
<nav><button data-t="home" class="on">總覽</button><button data-t="hold">持股</button><button data-t="watch">觀察清單</button><button data-t="set">設定</button></nav>
<div class="sidefoot mu" id="verinfo"></div></aside>
<div id="main"><header id="top"><button class="back" id="hb" hidden>← 返回</button><b id="ttl">總覽</b>
<div class="search"><input id="q" placeholder="搜尋個股:代號或名稱,例如 2330、台積電、NVDA" autocomplete="off"><div class="rs" id="rs"></div></div>
<span class="sp"></span><span class="mu" id="updinfo"></span><button class="btn p" id="upd">更新資料</button></header>
<main id="app"></main></div></div>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
const ma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
const mkt=s=>/\.TWO?$|^\^TW/.test(s)?"TW":"US",cur=m=>m==="TW"?"NT$":"US$";
const cc=v=>v>=0?"var(--r)":"var(--g)",sgn=v=>(v>=0?"+":"−")+fmt(Math.abs(v));
const UP="var(--r)",DN="var(--g)";
const N={d:120,w:104,m:60},TFN={d:"日 K",w:"週 K",m:"月 K"},TFU={d:"日",w:"週",m:"個月"};let TF="d",RV=null;const VER="v15-電腦版";let UPD="",WF="all";const TAGS=["打工型","上班型","老闆型","市值排列","其他"];
const RS={"stop": [["m_osc_down", "月 MACD 柱體比上月差"], ["w_osc_down", "週 MACD 柱體比上週差(週五判斷)"], ["w_close_down", "週收盤比上週差(週五判斷)"], ["below_w5", "收盤跌破 5 週均線"], ["below_ma20", "收盤跌破 20 日線"], ["below_ma60", "收盤跌破 60 日線(季線)"], ["below_ma120", "收盤跌破 120 日線(半年線)"], ["below_prev_wlow", "收盤跌破上週最低點"], ["below_entry_low", "收盤跌破進場日低點"], ["loss5", "虧損達 -5%"]], "tp": [["w_close_down", "週收盤比上週差(週五判斷)"], ["w_high_fail", "當週最高價未創前週新高(週五判斷)"], ["w_osc_down", "週 MACD 柱體比上週差(週五判斷)"], ["m_osc_down", "月 MACD 柱體比上月差"], ["below_ma5", "收盤跌破 5 日線"], ["below_w5", "收盤跌破 5 週均線"], ["fall_back", "獲利跌回門檻(保本)"]]};
const RG={STRONG_WIND:"強風",CHOPPY:"亂流",GUST:"陣風",NO_WIND:"無風"},RGT={STRONG_WIND:"勝率偏高的行情",CHOPPY:"行情震盪,嚴守紀律",GUST:"開始起風,嘗試交易",NO_WIND:"勝率很低,多做多賠!"},GOV={TW:"^TWOII",US:"^SOX"};
const rgChip=r=>`<span class="chip ${r==="STRONG_WIND"||r==="GUST"?"r":"g"}">${RG[r]}</span>`;
const RGN={STRONG_WIND:"老闆型、上班族型全策略可用",CHOPPY:"老闆型分 5 筆以上,上班族型降級或觀望",GUST:"開始起風,可用小部位嘗試",NO_WIND:"僅限老闆型「廉價收購」,上班族型暫停"};
const ST={A:"老闆型・週拉回風箏",B:"老闆型・廉價收購",C:"上班族型・週趨勢風箏",D:"上班族型・強勢週風箏"};
const LV={LEVEL_1:"營收創歷史新高",LEVEL_2:"爆發成長(YoY ≥ 100%)",LEVEL_3:"穩定門檻(YoY ≥ 30%)",FILTER_OUT:"YoY < 30%(排除)"};
const rgOf=sym=>(DB.indices[GOV[mkt(sym)]]||{}).regime;
const allowed=sym=>rgOf(sym)==="NO_WIND"?["B"]:["A","B","C","D"];
const ex=h=>(DB.stocks[h.sym]||{}).exit;
const exitReasons=h=>{const e=ex(h),Q=quote(h.sym);return e&&e.reasons?e.reasons:Q&&Q.px<=h.stop?["跌破預計停損價"]:[]};
let DB=null,tab="home",mk="TW",sel=null,MSG=null;
/* GitHub 寫回:直接修改 repo 內的 holdings.json */
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function gh(){let o="",r="";if(typeof location!=="undefined"&&location.hostname.endsWith(".github.io")){o=location.hostname.split(".")[0];r=location.pathname.split("/")[1]||""}
return{o:LS.get("gh_o")||o,r:LS.get("gh_r")||r,b:LS.get("gh_b")||"main",t:LS.get("gh_t")||""}}
const b64e=s=>{let b="";new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
async function api(path,opt={}){const g=gh();if(!g.t||!g.o||!g.r)throw new Error("請先到左側「設定」頁設定 GitHub 連線(帳號、repo 與存取權杖)");
const isGet=!opt.method,res=await fetch(`https://api.github.com/repos/${g.o}/${g.r}/${path}${isGet?(path.includes("?")?"&":"?")+"_="+Date.now():""}`,{...opt,cache:"no-store",headers:{Authorization:`Bearer ${g.t}`,Accept:opt.accept||"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}});
if(!res.ok){let d="";try{d=(await res.json()).message||""}catch(x){}const e=new Error((res.status===401?"權杖無效或已過期":res.status===403||res.status===404?"沒有權限或找不到 repo,請檢查權杖權限與 repo 名稱":res.status===409?"檔案剛被更新過,請重新整理頁面後再試一次":`GitHub 回應 ${res.status}`)+(d?`(${d})`:""));e.status=res.status;throw e}
return res.status===204?null:res.json()}
async function readCfg(){const j=await api(`contents/holdings.json?ref=${encodeURIComponent(gh().b)}`);const cfg=JSON.parse(b64d(j.content));cfg.holdings=cfg.holdings||[];cfg.watchlist=cfg.watchlist||[];return{cfg,sha:j.sha}}
async function mutate(fn,msg){for(let k=0;k<3;k++){const{cfg,sha}=await readCfg();fn(cfg);
try{await api("contents/holdings.json",{method:"PUT",body:JSON.stringify({message:msg,content:b64e(JSON.stringify(cfg,null,2)+"\n"),sha,branch:gh().b})});return cfg}catch(e){if((e.status!==409&&e.status!==422)||k>=2)throw e;await new Promise(r=>setTimeout(r,900))}}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function refreshData(){if(UPD)return;const set=t=>{UPD=t;const b=$("#upd");if(b){b.textContent=t||"更新資料";b.disabled=!!t}},runs=()=>api("actions/workflows/update-data.yml/runs?per_page=1").then(j=>(j.workflow_runs||[])[0]);
try{set("送出中…");const prev=await runs();await api("actions/workflows/update-data.yml/dispatches",{method:"POST",body:JSON.stringify({ref:gh().b})});set("更新中(約 1–3 分鐘)…");let run=null;
for(let i=0;i<45;i++){await sleep(8000);const r=await runs();if(r&&(!prev||r.id!==prev.id)){run=r;if(r.status==="completed")break}}
if(!run||run.status!=="completed"){set("");say("更新還在進行中,請稍後重新整理頁面。",1);return render()}
if(run.conclusion!=="success"){set("");say("更新失敗("+run.conclusion+"),請到 GitHub 的 Actions 頁面查看 log。",1);return render()}
const j=await api(`contents/data/data.json?ref=${encodeURIComponent(gh().b)}`,{accept:"application/vnd.github.raw+json"});
DB=j;DB.holdings=DB.holdings||[];DB.watchlist=DB.watchlist||[];set("");say("資料已更新。");render()}
catch(e){set("");say("更新失敗:"+e.message+(e.status===403||e.status===404?"(請確認 token 的 Actions 權限為 Read and write)":""),1);render()}}
const say=(t,w)=>{MSG={t,w}};
function msgHtml(){const m=MSG;MSG=null;return m?`<div class="note${m.w?" w":""}">${esc(m.t)}</div>`:""}
async function run(fn,needData,okText){try{const cfg=await fn();DB.holdings=cfg.holdings;DB.watchlist=cfg.watchlist;let t=okText||"已儲存到 GitHub。";
if(needData)t+=" 要取得新資料(價格、線圖、營收、新聞、策略評估),請按右上角的「更新資料」。";say(t)}catch(e){say("儲存失敗:"+e.message,1)}render()}
function editor(sym,h){const inW=DB.watchlist.some(w=>w.sym===sym),v=k=>h&&h[k]!=null?esc(h[k]):"";
return `<div class="card" id="edcard"><b>${h?"編輯持股":"加入持股"}</b><div class="ed"><div><label>名稱</label><input id="e_n" value="${esc(nameOf(sym))}"></div><div><label>股數</label><input id="e_sh" type="number" step="any" value="${v("shares")}"></div><div><label>成本價</label><input id="e_cost" type="number" step="any" value="${v("cost")}"></div><div><label>預計停損價</label><input id="e_stop" type="number" step="any" value="${v("stop")}"></div><div><label>預計停利價</label><input id="e_tp" type="number" step="any" value="${v("tp")}"></div><div><label>策略</label><select id="e_st"><option value="">未指定</option>${["A","B","C","D"].map(k=>`<option value="${k}"${h&&h.strategy===k?" selected":""}>${k}・${ST[k]}</option>`).join("")}</select></div><div><label>進場日期</label><input id="e_ed" type="date" value="${v("entry_date")}"></div><div class="f"><label>買進原因</label><textarea id="e_why" rows="2">${v("why")}</textarea></div><div class="f"><label>出場規則(備註)</label><input id="e_rule" value="${v("rule")}"></div><div class="f ck"><label>自訂停損條件(任一觸發即出場)</label>${RS.stop.map(([id,lb])=>`<label><input type="checkbox" name="rs" value="${id}"${h&&h.rules&&(h.rules.stop||[]).includes(id)?" checked":""}>${esc(lb)}</label>`).join("")}</div><div class="f ck"><label>自訂停利條件(獲利達門檻後,任一觸發即出場)</label>${RS.tp.map(([id,lb])=>`<label><input type="checkbox" name="rt" value="${id}"${h&&h.rules&&(h.rules.tp||[]).includes(id)?" checked":""}>${esc(lb)}</label>`).join("")}</div><div><label>停利啟用的獲利門檻 %</label><input id="e_ta" type="number" step="any" placeholder="10" value="${v("tp_after")}"></div></div><div class="row" style="margin-top:12px"><button class="btn p" id="sv">儲存到 GitHub</button>${h?`<button class="btn" id="rm">移除持股</button>`:inW?`<button class="btn" id="rmw">移除觀察</button>`:""}</div><div class="mu" style="margin-top:8px">儲存會直接修改 repo 裡的 holdings.json。策略 D 的時間停損、進場日低點,以及放風箏階段的最高損益,都需要填進場日期才算得準。</div></div>`}
let GOEDIT=false;
const newHoldForm=()=>`<div class="card"><b>新增持股</b><div class="mu" style="margin:6px 0">輸入代號與名稱,下一步填股數、成本、停損停利和策略。台股 4 碼數字預設為上市(.TW),上櫃請輸入 .TWO。</div><div class="ed"><div><label>代號</label><input id="nh_s" placeholder="2308 或 NVDA"></div><div><label>名稱(選填)</label><input id="nh_n" placeholder="台達電"></div></div><button class="btn p" id="nh" style="margin-top:10px">新增並編輯</button></div>`;
function newHolding(){let s=$("#nh_s").value.trim().toUpperCase();const n=$("#nh_n").value.trim();if(!s)return;if(/^\d{4,6}[A-Z]?$/.test(s))s+=".TW";if(n)TMP[s]=n;GOEDIT=true;open(s)}
const watchForm=()=>`<div class="card"><b>新增觀察個股</b><div class="mu" style="margin:6px 0">加入後就能搜尋。台股 4 碼數字預設為上市(.TW),上櫃請輸入 .TWO,例如 6488.TWO。</div><div class="ed"><div><label>代號</label><input id="w_s" placeholder="2454 或 NVDA"></div><div><label>名稱(選填)</label><input id="w_n" placeholder="聯發科"></div>${tagFields("w")}</div><button class="btn p" id="aw" style="margin-top:10px">加入觀察清單</button></div>`;

const on=(i,f)=>{const e=$(i);if(e)e.onclick=f};
on("#bk",goBack);bindChart();on("#svt",saveTag);on("#upd",refreshData);on("#hb",goBack);on("#sv",saveHolding);on("#rm",removeHolding);on("#rmw",removeWatch);on("#aw",addWatch);on("#gs",saveGH);on("#gt",testGH);on("#gc",clearGH);
on("#goedit",()=>{const e=$("#edcard");if(e)e.scrollIntoView({behavior:"smooth"})});on("#nh",newHolding);
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{GOEDIT=true});
document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{TF=b.dataset.tf;render()});
document.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{WF=b.dataset.wf;render()});
document.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{RV=b.dataset.rv;render()});
if(GOEDIT&&sel){GOEDIT=false;const e=$("#edcard");if(e)e.scrollIntoView()}}
function open(s){sel=s;$("#rs").innerHTML="";$("#q").value="";try{history.pushState({d:1},"")}catch(e){}render();scrollTo(0,0)}
/* 搜尋範圍:持股 + watchlist */
function hits(v){v=v.trim().toLowerCase();if(!v)return[];const u=[...DB.holdings,...DB.watchlist.filter(w=>!held(w.sym))];return u.filter(x=>x.sym.toLowerCase().includes(v)||(x.name||"").toLowerCase().includes(v)).slice(0,8)}
$("#q").oninput=e=>{const r=hits(e.target.value),v=e.target.value.trim();$("#rs").innerHTML=!v?"":r.length?r.map(x=>`<div data-s="${esc(x.sym)}"><b>${esc(x.sym)}</b> ${esc(x.name||"")} ${held(x.sym)?'<span class="chip">持股</span>':""}</div>`).join(""):`<div class="mu">不在追蹤清單。到「觀察清單」新增後,按「更新資料」即可搜尋。</div>`;
document.querySelectorAll("#rs [data-s]").forEach(b=>b.onclick=()=>open(b.dataset.s))};
$("#q").onkeydown=e=>{if(e.key==="Enter"){const r=hits(e.target.value);if(r[0])open(r[0].sym)}};
document.querySelectorAll("#side [data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t!=="home"&&tab==="home"){try{history.pushState({t:1},"")}catch(e){}}tab=t;sel=null;render();scrollTo(0,0)});
let rz;try{window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(DB&&sel&&document.querySelector("#chw"))render()},250)})}catch(e){}
/* 載入:data.json 放行情;持股設定優先從 GitHub 讀最新版(有設定權杖時),否則讀 holdings.json */
(async()=>{try{const [d,hj]=await Promise.all([fetch("data/data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),
(gh().t?readCfg().then(x=>x.cfg).catch(()=>null):Promise.resolve(null)).then(c=>c||fetch("holdings.json?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null))]);
DB=d;if(hj){DB.holdings=hj.holdings||[];DB.watchlist=hj.watchlist||[]}DB.holdings=DB.holdings||[];DB.watchlist=DB.watchlist||[];render()}
catch(e){$("#app").innerHTML=`<div class="card"><b>讀不到 data/data.json</b><p class="mu">請透過 GitHub Pages 或本機伺服器開啟(python -m http.server),直接雙擊檔案無法讀取。</p></div>`}})();
</script>
</body>
</html>
